<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Metas 1000 — Volume 1</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#E9EDF1; --ink:#1B2430; --muted:#5A6675;
  --line:#D4DAE1; --accent:#1F5C4D; --accent-ink:#FFFFFF; --good:#2E7D4F; --warn:#9A7422; --bad:#A63434;
  --chip-err:#F3DEDE; --chip-err-ink:#7C2626; --shadow:0 1px 3px rgba(27,36,48,.10),0 8px 24px rgba(27,36,48,.08);
  --hl-chave:#B03A2E; --hl-lei:#1F5FA8; --hl-num:#6D3F9E; --hl-pega:#8A6A14;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#1A222C; --surface2:#232D39; --ink:#E8ECF1; --muted:#94A1B0;
    --line:#2E3947; --accent:#4FA98D; --accent-ink:#0E1A16; --good:#5FBE85; --warn:#D3A94E; --bad:#D97C7C;
    --chip-err:#3A2426; --chip-err-ink:#E6A9A9; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --hl-chave:#F08A7E; --hl-lei:#7EB3F0; --hl-num:#C9A2F0; --hl-pega:#E5C25E;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#1A222C; --surface2:#232D39; --ink:#E8ECF1; --muted:#94A1B0;
  --line:#2E3947; --accent:#4FA98D; --accent-ink:#0E1A16; --good:#5FBE85; --warn:#D3A94E; --bad:#D97C7C;
  --chip-err:#3A2426; --chip-err-ink:#E6A9A9; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --hl-chave:#F08A7E; --hl-lei:#7EB3F0; --hl-num:#C9A2F0; --hl-pega:#E5C25E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 16px;flex-wrap:wrap}
.brand{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.35rem;font-weight:700;letter-spacing:.01em}
.brand small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;display:block}
.resumo{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.resumo b{color:var(--ink)}
/* ---- home ---- */
.grid-blocos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.bloco h2{font-size:1.02rem}
.bloco .faixa{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.barra{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bloco .nums{display:flex;gap:12px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bloco .nums .ok{color:var(--good)} .bloco .nums .err{color:var(--bad)}
.chip{display:inline-block;background:var(--chip-err);color:var(--chip-err-ink);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.acoes{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:600;font-size:.86rem;transition:filter .15s}
.btn:hover{filter:brightness(.96)}
.btn.primaria{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.mini{padding:5px 10px;font-size:.78rem}
/* ---- sessão ---- */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sess-top .modo{display:flex;gap:6px;flex-wrap:wrap}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:600;color:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.progress-linha{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted)}
.progress-linha .barra{flex:1}
.palco{perspective:1400px}
.carta{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.1,.2,1)}
.carta.virada{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.carta{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;overflow:auto}
.face.verso{transform:rotateY(180deg)}
.face .meta-linha{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px;flex-wrap:wrap}
.face .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;color:var(--ink);font-size:.9rem}
.texto-p{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.32rem;line-height:1.42;font-weight:700;text-wrap:balance;margin:auto 0}
.texto-r{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.05rem;line-height:1.5;margin:auto 0}
.texto-r .abre{font-weight:700}
.hl-chave{color:var(--hl-chave);font-weight:700}
.hl-lei{color:var(--hl-lei);font-weight:600}
.hl-num{color:var(--hl-num);font-weight:700}
.hl-pega{color:var(--hl-pega)}
.hl-pega .rotulo{font-weight:700;text-transform:uppercase;font-size:.82em;letter-spacing:.05em}
.dicas-area{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.dica{background:var(--surface2);border-left:3px solid var(--warn);border-radius:8px;padding:8px 12px;font-size:.86rem}
.dica b{color:var(--warn);text-transform:uppercase;font-size:.7rem;letter-spacing:.07em;display:block;margin-bottom:2px}
.nota-errei{margin-top:14px;background:var(--chip-err);color:var(--chip-err-ink);border-radius:8px;padding:8px 12px;font-size:.83rem;font-weight:600}
.controles{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.controles .linha{max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.btn.grau{flex:1;max-width:170px;padding:11px 8px;font-size:.9rem;border-width:2px}
.btn.g0{border-color:var(--bad);color:var(--bad)} .btn.g0:hover{background:var(--chip-err)}
.btn.g1{border-color:var(--warn);color:var(--warn)}
.btn.g2{border-color:var(--good);color:var(--good)}
.btn.seta{padding:11px 14px;font-size:1rem}
.atalhos{max-width:880px;margin:6px auto 0;text-align:center;font-size:.68rem;color:var(--muted)}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.9em}
/* ---- lista ---- */
.lista{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.item:hover{filter:brightness(.97)}
.item .n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--muted);width:3.2ch;flex:none;font-size:.82rem}
.item .t{flex:1;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--surface2);border:1px solid var(--line)}
.dot.g0{background:var(--bad);border-color:var(--bad)} .dot.g1{background:var(--warn);border-color:var(--warn)} .dot.g2{background:var(--good);border-color:var(--good)}
.aviso-vazio{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:.9rem}
.voltar{color:var(--muted);font-size:.84rem;font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.fim{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.fim h2{font-family:"Iowan Old Style",Palatino,Georgia,serif}
.fim .placar{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.fim .placar div{text-align:center}
.fim .placar .v{font-size:1.7rem;font-weight:700}
.fim .placar .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.oculto{display:none}
</style>
</head>

<script>
const DATA = [{"n": 1, "id": "m1000-0001", "meta": 9, "disc": "Civil", "tema": "Defeitos do negócio jurídico", "tipo": "Livro — Metas", "p": "Quando o falso motivo vicia a declaração de vontade (CC, art. 140)?", "r": "SÓ QUANDO EXPRESSO COMO RAZÃO DETERMINANTE do negócio — nunca 'sempre' (art. 140 CC). O dolo de ambas as partes impede a anulação e a indenização (art. 150), o erro pode ser unilateral (art. 138) e o erro essencial torna o ato anulável (art. 139, I). Pegadinha: o advérbio 'sempre' é o marcador clássico da alternativa falsa.", "d1": "Cuidado com o advérbio absoluto que a banca planta.", "d2": "O falso motivo exige menção expressa como razão determinante.", "nota": "", "errei": false}, {"n": 2, "id": "m1000-0002", "meta": 9, "disc": "Civil", "tema": "Invalidade do negócio jurídico", "tipo": "Livro — Metas", "p": "Qual o vício e o prazo da venda de ascendente a descendente sem consentimento dos demais, inclusive por interposta pessoa (CC, arts. 496 e 179)?", "r": "ANULÁVEL, COM PRAZO DECADENCIAL DE 2 ANOS — o art. 496 CC fala em anulabilidade (não nulidade) e, sem prazo próprio, aplica-se o decadencial geral de 2 anos do art. 179. Pegadinha: 'interposta pessoa' sugere simulação/nulidade, mas prevalece a regra especial do art. 496; e não confundir os 2 anos (art. 179) com os 4 do art. 178.", "d1": "A regra especial do art. 496 prevalece sobre a aparência de simulação.", "d2": "Anulável + prazo decadencial geral do art. 179.", "nota": "", "errei": false}, {"n": 3, "id": "m1000-0003", "meta": 9, "disc": "Civil", "tema": "Prescrição e decadência", "tipo": "Livro — Metas", "p": "Qual princípio a ordem jurídica prestigia com a prescrição e a decadência?", "r": "SEGURANÇA JURÍDICA — os prazos existem para estabilizar as relações e evitar a eternização da incerteza pela inércia do titular. Pegadinha: proporcionalidade e razoabilidade são iscas genéricas, e prevenção/precaução pertencem ao Direito Ambiental.", "d1": "Pense no que a inércia eterna do titular ameaçaria.", "d2": "Estabilidade das relações jurídicas.", "nota": "", "errei": false}, {"n": 4, "id": "m1000-0004", "meta": 9, "disc": "Civil", "tema": "Prescrição e decadência", "tipo": "Livro — Metas", "p": "Quantas vezes a prescrição pode ser interrompida e quem pode promover a interrupção (CC, arts. 202 e 203)?", "r": "UMA ÚNICA VEZ (art. 202, caput), por QUALQUER INTERESSADO (art. 203) — e o protesto cambial é hipótese interruptiva (art. 202, III). Interrompida, o prazo recomeça DO ZERO (art. 202, p. ún.); 'descontar o período já transcorrido' é efeito da suspensão. Pegadinha: o despacho que ordena a citação interrompe ainda que o juiz seja incompetente (art. 202, I).", "d1": "Interrupção zera o prazo; suspensão desconta.", "d2": "Só uma vez; protesto cambial interrompe (art. 202, III).", "nota": "", "errei": false}, {"n": 5, "id": "m1000-0005", "meta": 9, "disc": "Civil", "tema": "Prescrição e decadência", "tipo": "Livro — Metas", "p": "A interrupção da prescrição operada contra um herdeiro do devedor solidário prejudica os demais herdeiros e codevedores (CC, art. 204, §2º)?", "r": "NÃO, SALVO OBRIGAÇÕES INDIVISÍVEIS — a interrupção contra um dos herdeiros do devedor solidário não prejudica os outros herdeiros nem os demais devedores (art. 204, §2º); dívida em dinheiro é divisível, então o efeito fica restrito ao herdeiro atingido. Pegadinha: não confundir com o §1º, em que a interrupção contra o próprio devedor solidário alcança os demais e seus herdeiros.", "d1": "Distinga interromper contra o devedor solidário e contra um herdeiro dele.", "d2": "Contra herdeiro: efeito restrito, salvo indivisibilidade.", "nota": "", "errei": false}, {"n": 6, "id": "m1000-0006", "meta": 9, "disc": "Civil", "tema": "Escritura pública", "tipo": "Livro — Metas", "p": "O que a escritura pública deve sempre conter quanto à leitura do ato (CC, art. 215, §1º, VI)?", "r": "DECLARAÇÃO DE TER SIDO LIDA na presença das partes e demais comparecentes, ou de que todos a leram (art. 215, §1º, VI, CC). Ela é redigida na língua nacional (§3º) e, se o comparecente não a souber, exige-se tradutor ou intérprete (§2º) — não 'notário fluente'. Pegadinha: assinatura a rogo é para quem está presente e não pode/sabe assinar, e a assinatura dos cônjuges das partes não é requisito geral.", "d1": "Requisito ligado à ciência do conteúdo pelas partes.", "d2": "A declaração de leitura (ou de que todos leram) é obrigatória.", "nota": "", "errei": false}, {"n": 7, "id": "m1000-0007", "meta": 9, "disc": "Civil", "tema": "Obrigações alternativas", "tipo": "Livro — Metas", "p": "Nas obrigações alternativas, a quem cabe a escolha e como funciona nas prestações periódicas (CC, art. 252)?", "r": "AO DEVEDOR, como regra (art. 252, caput); nas prestações periódicas, a faculdade de opção pode ser exercida EM CADA PERÍODO (§2º). O devedor não pode obrigar o credor a receber parte em uma prestação e parte em outra (§1º). Pegadinha: a banca inverte a regra e atribui a escolha ao credor.", "d1": "Quem escolhe é a parte que deve cumprir.", "d2": "Devedor escolhe; opção renovada a cada período.", "nota": "", "errei": false}, {"n": 8, "id": "m1000-0008", "meta": 9, "disc": "Civil", "tema": "Teoria da imprevisão", "tipo": "Livro — Metas", "p": "Que direitos tem o devedor de contrato de execução continuada atingido por fato extraordinário e imprevisível, como uma pandemia (CC, arts. 478-480)?", "r": "PEDIR A RESOLUÇÃO OU A REVISÃO do contrato — a onerosidade excessiva por evento extraordinário e imprevisível autoriza a resolução (art. 478) ou a revisão das cláusulas (arts. 479 e 317). Pegadinha: alternativas com 'suspensão das prestações' ou 'prorrogação da carência' inventam soluções sem amparo legal.", "d1": "São duas saídas legais, não invenções contratuais.", "d2": "Resolução (478) ou revisão (479/317).", "nota": "", "errei": false}, {"n": 9, "id": "m1000-0009", "meta": 9, "disc": "Civil", "tema": "Herança de pessoa viva", "tipo": "Livro — Metas", "p": "Qual a sanção para a renúncia antecipada a quinhão de herança de pessoa viva, mesmo homologada judicialmente (CC, arts. 426 e 166)?", "r": "NULIDADE — herança de pessoa viva não pode ser objeto de contrato (pacta corvina, art. 426 CC), e o negócio é nulo (art. 166). Pegadinha: a homologação judicial NÃO convalida o ato, e as opções 'ineficaz' ou 'anulável' erram a categoria do vício.", "d1": "É o vício mais grave do sistema.", "d2": "Pacta corvina = nulo; homologação não salva.", "nota": "", "errei": false}, {"n": 10, "id": "m1000-0010", "meta": 9, "disc": "Civil", "tema": "Inadimplemento antecipado", "tipo": "Livro — Metas", "p": "O credor pode resolver o contrato antes do vencimento quando já é evidente que o devedor não cumprirá?", "r": "SIM — É O INADIMPLEMENTO ANTECIPADO (quebra antecipada): evidenciado antes do termo que a prestação não virá, o credor pode pedir a extinção do pacto com devolução do que antecipou. Pegadinhas vizinhas: preço ao arbítrio exclusivo de uma parte é NULO (art. 489 CC) e riscos do agronegócio (chuva, praga, oscilação de preço) são álea ordinária, sem imprevisão (STJ).", "d1": "A quebra certa dispensa esperar o calendário.", "d2": "Quebra antecipada — resolve antes do termo, com devolução.", "nota": "", "errei": false}, {"n": 11, "id": "m1000-0011", "meta": 10, "disc": "Notarial/Registral", "tema": "Sustação do protesto", "tipo": "IESES · TJ-AM · Remoção · 2023", "p": "Tornada definitiva a ordem de sustação do protesto, o que o tabelião faz com o título (Lei 9.492/97, art. 17, §3º)?", "r": "ENCAMINHA AO JUÍZO RESPECTIVO quando não houver determinação expressa de a quem entregar, ou se a parte autorizada não retirar em 30 dias (art. 17, §3º). Antes da lavratura, a retirada pelo apresentante exige pagamento dos emolumentos (art. 16); sustado judicialmente, pagamento e retirada só com autorização judicial (§1º). Pegadinha: revogada a sustação, protesta-se SEM nova intimação (§2º).", "d1": "O título não fica no cartório para sempre.", "d2": "Sem destinatário expresso ou após 30 dias → vai ao Juízo.", "nota": "", "errei": false}, {"n": 12, "id": "m1000-0012", "meta": 10, "disc": "Notarial/Registral", "tema": "Intimação no protesto", "tipo": "IESES · TJ-PA · Remoção · 2026", "p": "Quando cabe a intimação do devedor por edital no protesto (Lei 9.492/97, arts. 14 e 15)?", "r": "SÓ SUBSIDIARIAMENTE — antes do edital, o tabelião tenta a intimação no endereço fornecido pelo apresentante, em especial por via postal (art. 14); o edital é para devedor não localizado (art. 15). Pegadinhas: a lei não fixa índice 'Selic' (art. 11); cheque exige comprovação da apresentação ao banco e protesta-se no lugar do pagamento ou domicílio do emitente (art. 6º), não no banco sacado; para CCB com alienação fiduciária o STJ admite a praça de pagamento OU o domicílio do devedor.", "d1": "O edital não é a porta de entrada.", "d2": "Primeiro a via postal no endereço do apresentante; edital depois.", "nota": "", "errei": false}, {"n": 13, "id": "m1000-0013", "meta": 10, "disc": "Notarial/Registral", "tema": "Sustação e cancelamento", "tipo": "CESPE · TJ-RR · Remoção · 2025", "p": "Sustado judicialmente o protesto, o devedor pode pagar o título livremente (Lei 9.492/97, art. 17, §1º)?", "r": "NÃO — MESMO O PAGAMENTO SÓ COM AUTORIZAÇÃO JUDICIAL enquanto durar a sustação (art. 17, §1º). Cabe protesto por falta de aceite antes do vencimento (art. 21, §1º), dia de expediente bancário reduzido NÃO conta como útil (art. 12, §2º) e o cancelamento também se faz por anuência do credor, não só pelo original (art. 26). Pegadinha: cancelamento por ordem judicial não dispensa emolumentos.", "d1": "A ordem judicial congela tudo, até a via amigável.", "d2": "Pagamento durante a sustação depende do juiz.", "nota": "", "errei": false}, {"n": 14, "id": "m1000-0014", "meta": 10, "disc": "Notarial/Registral", "tema": "Protesto falimentar", "tipo": "FGV · TJ-SE · Remoção · 2023", "p": "O protesto para fins falimentares exige a identificação de quem recebeu a intimação (Súmula 361/STJ)?", "r": "SIM — SEM IDENTIFICAÇÃO DO RECEBEDOR NO AR, O PROTESTO FALIMENTAR É VICIADO e, comprovado o vício pelo requerido, a falência não é decretada (Súmula 361/STJ; Lei 9.492/97, art. 14 c/c Lei 11.101/05). Pegadinha: no protesto cambial comum basta a entrega no endereço; a exigência de identificação é própria do protesto especial para falência.", "d1": "A régua da intimação sobe quando o objetivo é quebrar a empresa.", "d2": "Cambial: entrega basta; falimentar: identifica quem recebeu.", "nota": "", "errei": false}, {"n": 15, "id": "m1000-0015", "meta": 10, "disc": "Notarial/Registral", "tema": "Pagamento do título", "tipo": "VUNESP · TJ-GO · Remoção · 2021", "p": "No pagamento em cartório subsistindo parcelas vincendas, como o tabelião dá a quitação (Lei 9.492/97, art. 19, §4º)?", "r": "QUITAÇÃO DA PARCELA EM APARTADO, DEVOLVENDO-SE O ORIGINAL AO APRESENTANTE (art. 19, §4º). O tabelião não pode recusar pagamento em espécie no prazo legal (§1º) e o pagamento por cheque — mesmo de banco — só gera quitação com a efetiva liquidação (§3º). Pegadinha: a banca inverte o §3º com 'salvo se de emissão de estabelecimento bancário'.", "d1": "O título ainda vive — as parcelas futuras continuam nele.", "d2": "Quitação em apartado + original de volta ao apresentante.", "nota": "", "errei": false}, {"n": 16, "id": "m1000-0016", "meta": 10, "disc": "Notarial/Registral", "tema": "Protesto de decisão judicial", "tipo": "FGV · TJ-SC · Remoção · 2021", "p": "Sentença transitada em julgado pode ser protestada mesmo com ação rescisória em curso (CPC, arts. 517 e 969)?", "r": "SIM — a decisão transitada em julgado vai a protesto após o prazo de pagamento voluntário (CPC, art. 517 c/c 523), e a rescisória NÃO tem efeito suspensivo automático nem impede o protesto (art. 969). O tabelião intima o devedor e lavra o protesto se não houver pagamento — não é 'imediato'. Pegadinha: o cumprimento de sentença em curso não retira o interesse na via extrajudicial.", "d1": "Pense no efeito (ou na falta dele) da rescisória.", "d2": "Rescisória não suspende; intima e protesta.", "nota": "", "errei": false}, {"n": 17, "id": "m1000-0017", "meta": 10, "disc": "Notarial/Registral", "tema": "Distribuição", "tipo": "IESES · TJ-AM · Remoção · 2023", "p": "Como se dá a recepção das indicações de duplicatas a protesto e quando há distribuição prévia obrigatória (Lei 9.492/97, arts. 7º e 8º)?", "r": "AS INDICAÇÕES DE DUPLICATAS mercantis e de prestação de serviços PODEM SER RECEPCIONADAS POR MEIO MAGNÉTICO OU ELETRÔNICO, sob inteira responsabilidade do apresentante quanto aos dados, cabendo ao tabelionato a mera instrumentalização (art. 8º, p. ún.). A distribuição prévia obrigatória só existe onde há MAIS de um tabelionato (art. 7º), por serviço mantido pelos próprios tabelionatos, com entrega na mesma data (art. 8º, caput). Pegadinha: 'sorteio' e 'prazo de 24 horas' são invenções.", "d1": "Duplicata escritural entra por indicação, sem papel.", "d2": "Responsabilidade pelos dados: do apresentante (art. 8º, p. ún.).", "nota": "", "errei": false}, {"n": 18, "id": "m1000-0018", "meta": 10, "disc": "Notarial/Registral", "tema": "Título em moeda estrangeira", "tipo": "FGV · Enac · 2025", "p": "Como se protesta título em moeda estrangeira e em que moeda se paga (Lei 9.492/97, art. 10)?", "r": "COM TRADUÇÃO POR TRADUTOR PÚBLICO JURAMENTADO (art. 10, caput), e o pagamento é em MOEDA CORRENTE NACIONAL, cabendo ao apresentante a conversão na data da apresentação (§2º). Título vencido há anos não trava nada: o tabelião não investiga prescrição (art. 9º). Pegadinha: 'profissional idôneo' no lugar do tradutor juramentado e 'pagamento na própria moeda estrangeira'.", "d1": "Quem traduz tem fé pública própria.", "d2": "Tradutor juramentado + pagamento em real (conversão na apresentação).", "nota": "", "errei": false}, {"n": 19, "id": "m1000-0019", "meta": 10, "disc": "Notarial/Registral", "tema": "Princípios do protesto", "tipo": "VUNESP · TJ-SP · Ingresso · 2024", "p": "Em que consiste o princípio da formalidade mitigada no procedimento do protesto?", "r": "CELERIDADE E SIMPLIFICAÇÃO DOS PRAZOS na tiragem do protesto (protocolização, tríduo legal), preservada a segurança jurídica dos atos. Pegadinha: as demais alternativas descrevem OUTROS princípios verdadeiros — rogação/instância (iniciativa do credor), natureza híbrida do ato dotado de fé pública e insubstituibilidade (prova única) — mas o comando pede o conceito específico.", "d1": "O nome do princípio fala de forma 'aliviada'.", "d2": "É o princípio dos prazos rápidos e simplificados (tríduo).", "nota": "", "errei": false}, {"n": 20, "id": "m1000-0020", "meta": 10, "disc": "Notarial/Registral", "tema": "Apresentação e protocolização", "tipo": "IESES · TJ-AM · Remoção · 2023", "p": "Em títulos sujeitos a correção monetária, como se calcula o pagamento no protesto (Lei 9.492/97, art. 11)?", "r": "PELA CONVERSÃO VIGORANTE NO DIA DA APRESENTAÇÃO, no valor indicado pelo apresentante (art. 11). Título estrangeiro exige tradução JURAMENTADA (art. 10) — não 'simples ou juramentada' — e a conversão cambial também é da data da apresentação (§2º), não do pagamento. Pegadinha: o tabelião NÃO pode obstar o registro por prescrição ou caducidade (art. 9º).", "d1": "O marco temporal não é o dia do pagamento.", "d2": "Dia da apresentação + valor indicado pelo apresentante.", "nota": "", "errei": false}, {"n": 21, "id": "m1000-0021", "meta": 11, "disc": "Processo Civil", "tema": "Jurisdição e ação", "tipo": "Ieses · TJ-TO · Ingresso · 2022", "p": "Como se compreende modernamente o direito de ação e a inércia da jurisdição (CPC, arts. 2º e 17)?", "r": "DIREITO À TUTELA JURISDICIONAL ADEQUADA — a ação não se esgota no pedido inicial: envolve situações subjetivas ao longo do procedimento, abrange também o réu (a ampla defesa integra o direito de ação) e a jurisdição só se movimenta por demanda da parte (nemo iudex sine actore). Pegadinha: a banca troca a autoria da teoria da ação como direito potestativo — erro histórico plantado numa frase de aparência correta.", "d1": "Pense além do pedido inicial: o que a parte tem direito de obter do processo?", "d2": "Tutela adequada + jurisdição inerte; cuidado com a autoria das teorias.", "nota": "", "errei": false}, {"n": 22, "id": "m1000-0022", "meta": 11, "disc": "Processo Civil", "tema": "Competência — União no feito", "tipo": "Consulplan · TJ-AC · Remoção · 2023", "p": "A admissão da União como assistente simples desloca a competência para a Justiça Federal (CF, art. 109, I)?", "r": "SIM — a assistência simples pressupõe INTERESSE JURÍDICO (não meramente econômico); reconhecido o interesse da União, a competência desloca-se para a Justiça Federal (CF, art. 109, I; Súmula 150/STJ). Sociedade de economia mista federal fica na Justiça comum (Súmulas 556/STF e 42/STJ), e a perpetuatio jurisdictionis (CPC, art. 43) cede diante de alteração de competência absoluta. Pegadinha: a intervenção anômala (art. 5º da Lei 9.469/97) é a de interesse econômico e NÃO desloca — a admissão como assistente a descaracteriza.", "d1": "Diferencie o tipo de interesse que cada figura interventiva revela.", "d2": "Assistente simples = interesse jurídico = Justiça Federal.", "nota": "", "errei": false}, {"n": 23, "id": "m1000-0023", "meta": 11, "disc": "Processo Civil", "tema": "Gratuidade da justiça", "tipo": "Consulplan · TJ-MA · Ingresso · 2023", "p": "O estrangeiro não residente no Brasil tem direito à gratuidade da justiça (CPC, art. 98)?", "r": "SIM — o art. 98 fala em pessoa natural 'brasileira ou estrangeira' com insuficiência de recursos, e o STJ estendeu a gratuidade ao estrangeiro não residente. A gratuidade ENGLOBA os emolumentos notariais e registrais (art. 98, §1º, IX) e a cláusula ad exitum com o advogado não a afasta. Pegadinha: o beneficiário vencido não fica 'isento' — as verbas ficam sob condição suspensiva de exigibilidade (§§2º e 3º).", "d1": "A lei não exige vínculo territorial.", "d2": "Estrangeiro não residente: sim; vencido: condição suspensiva.", "nota": "", "errei": false}, {"n": 24, "id": "m1000-0024", "meta": 11, "disc": "Processo Civil", "tema": "Litisconsórcio", "tipo": "Consulplan · TJ-MS · Remoção · 2021", "p": "Quando o litisconsórcio é unitário (CPC, art. 116)?", "r": "QUANDO O MÉRITO TIVER DE SER DECIDIDO DE MODO UNIFORME para todos os litisconsortes, pela natureza da relação jurídica (art. 116). No unitário, o recurso de um pode aproveitar aos demais (art. 1.005) e os atos e omissões de um não prejudicam os outros (art. 117). Pegadinha: não confundir unitário (decisão uniforme) com necessário (formação obrigatória, art. 114).", "d1": "O nome vem do resultado da decisão, não da formação.", "d2": "Decisão uniforme para todos = unitário.", "nota": "", "errei": false}, {"n": 25, "id": "m1000-0025", "meta": 11, "disc": "Processo Civil", "tema": "Chamamento ao processo", "tipo": "Consulplan · TJ-MS · Ingresso · 2021", "p": "Quais as hipóteses de chamamento ao processo e o que fica de fora (CPC, arts. 130 e 125, II)?", "r": "AFIANÇADO, DEMAIS FIADORES E DEVEDORES SOLIDÁRIOS (art. 130, I a III) — já a ação regressiva de quem está obrigado, por lei ou contrato, a indenizar o vencido é DENUNCIAÇÃO DA LIDE (art. 125, II), não chamamento. Pegadinha: 'ação regressiva por indenização' é sempre denunciação.", "d1": "Um instituto traz o codevedor; o outro, o garantidor do regresso.", "d2": "Regresso indenizatório = denunciação (art. 125, II).", "nota": "", "errei": false}, {"n": 26, "id": "m1000-0026", "meta": 11, "disc": "Processo Civil", "tema": "Prazos do juiz", "tipo": "FGV · TJ-SE · Ingresso · 2023", "p": "Qual o rito da representação por excesso de prazo contra o juiz (CPC, art. 235)?", "r": "JUSTIFICATIVA → ATO EM 10 DIAS → SUBSTITUTO LEGAL: intimado, o juiz apresenta justificativa (§1º); não sendo caso de arquivamento, o corregedor determina que pratique o ato em 10 dias (§2º); mantida a inércia, os autos vão ao substituto legal (§3º). Qualquer parte, o MP ou a Defensoria podem representar. Pegadinha: o prazo é de 10 dias (não 5) e o desfecho é a remessa ao substituto, não sentença forçada do próprio juiz.", "d1": "Três etapas e um desfecho fora das mãos do representado.", "d2": "10 dias para o ato; inércia → substituto legal.", "nota": "", "errei": false}, {"n": 27, "id": "m1000-0027", "meta": 12, "disc": "Penal", "tema": "Erro no direito penal", "tipo": "Consulplan · TJ-AC · Remoção · 2023", "p": "Quem responde pelo crime quando o erro é determinado por terceiro, e quais os efeitos do erro de tipo e do erro de proibição (CP, arts. 20 e 21)?", "r": "O TERCEIRO QUE DETERMINA O ERRO responde pelo crime (art. 20, §2º). O erro de tipo exclui o dolo, punindo-se a culpa se prevista (art. 20, caput); o erro de proibição inevitável isenta de pena e o evitável reduz de 1/6 a 1/3 (art. 21); no erro sobre a pessoa consideram-se as qualidades da vítima pretendida (art. 20, §3º). Pegadinha: nessa questão todos os itens reproduziam a lei fielmente — cuidado com o reflexo de procurar inversão onde não há.", "d1": "O autor mediato do engano assume o lugar de quem errou.", "d2": "Erro determinado por terceiro → responde o terceiro.", "nota": "", "errei": false}, {"n": 28, "id": "m1000-0028", "meta": 12, "disc": "Penal", "tema": "Peculato culposo", "tipo": "FGV · TJ-ES · Ingresso · 2025", "p": "No peculato culposo, qual o efeito da reparação do dano feita após a sentença irrecorrível (CP, art. 312, §3º)?", "r": "REDUZ A PENA IMPOSTA PELA METADE — no peculato culposo (art. 312, §2º), a reparação ANTES da sentença irrecorrível extingue a punibilidade; DEPOIS dela, reduz a pena de metade (art. 312, §3º). Pegadinha: o tipo não exige 'grave prejuízo' e a figura culposa existe, sim.", "d1": "O momento da reparação define o prêmio.", "d2": "Antes da sentença: extingue; depois: metade.", "nota": "", "errei": false}, {"n": 29, "id": "m1000-0029", "meta": 12, "disc": "Penal", "tema": "Prescrição penal", "tipo": "Cebraspe · TJ-RR · Remoção · 2025", "p": "Interrompida a prescrição penal, de quando recomeça o prazo e quais causas interruptivas são incomunicáveis (CP, art. 117)?", "r": "RECOMEÇA DO DIA DA INTERRUPÇÃO, salvo a hipótese do início do cumprimento da pena (art. 117, V e p. ún.). Início do cumprimento (V) e reincidência (VI) são as únicas causas INCOMUNICÁVEIS entre corréus (§1º as excepciona); o recebimento da denúncia (I) interrompe só a pretensão punitiva e a pronúncia (II) É causa interruptiva. Pegadinha: o prazo não recomeça do trânsito em julgado.", "d1": "Duas causas não se comunicam aos coautores.", "d2": "Incisos V e VI = incomunicáveis; prazo recomeça da interrupção.", "nota": "", "errei": false}, {"n": 30, "id": "m1000-0030", "meta": 12, "disc": "Penal", "tema": "Crimes contra a pessoa", "tipo": "IESES · TJ-AM · Ingresso · 2023", "p": "De que depende a persecução do crime de lesão corporal culposa (Lei 9.099/95, art. 88)?", "r": "DE REPRESENTAÇÃO DA VÍTIMA, independentemente da magnitude da lesão (art. 88 da Lei 9.099/95). Lesão seguida de morte é preterdolosa: DOLO no antecedente e CULPA no consequente (art. 129, §3º, CP); o aborto de anencéfalo foi admitido pelo STF (ADPF 54), não por disposição do CP. Pegadinha: a banca inverte o preterdolo e troca STF por texto legal.", "d1": "A ação penal da forma culposa é condicionada.", "d2": "Representação sempre, qualquer que seja a gravidade.", "nota": "", "errei": false}, {"n": 31, "id": "m1000-0031", "meta": 13, "disc": "Processo Penal", "tema": "Ação penal privada", "tipo": "CESPE · TJ-RO · 2025", "p": "Morto o querelante, a ação penal privada se extingue de imediato (CPP, arts. 31 e 60, II)?", "r": "NÃO — PODE PROSSEGUIR O CADI (cônjuge, ascendente, descendente ou irmão — art. 31), desde que compareça no prazo legal de 60 dias (art. 60, II). A renúncia quanto a um dos autores do crime e o perdão a um dos querelados estendem-se aos demais (indivisibilidade — arts. 49 e 51) e admitem forma tácita; a perempção por não comparecimento exige ausência SEM motivo justificado (art. 60, III). Pegadinha: 'ainda que justificado' é o absoluto que a banca planta.", "d1": "A família pode assumir o volante, com prazo.", "d2": "CADI em 60 dias (arts. 31 e 60, II).", "nota": "", "errei": false}, {"n": 32, "id": "m1000-0032", "meta": 13, "disc": "Processo Penal", "tema": "Foro por prerrogativa", "tipo": "FGV · TJ-ES · 2025", "p": "Constituição estadual pode dar foro por prerrogativa no TJ a notários? E onde responde o deputado estadual (CF, arts. 27, §1º, e 125, §1º)?", "r": "NOTÁRIO NÃO; DEPUTADO ESTADUAL SIM, NO TJ — o STF só admite foro criado por Constituição estadual em SIMETRIA com autoridades previstas na CF, e o delegatário não tem paralelo constitucional, indo à 1ª instância; o deputado estadual tem foro no TJ por simetria com o deputado federal (CF, arts. 27, §1º, e 125, §1º). Pegadinha: STJ é foro de governador e STF é foro de deputado federal.", "d1": "A Constituição estadual só copia, não cria do zero.", "d2": "Simetria: deputado estadual → TJ; notário → 1ª instância.", "nota": "", "errei": false}, {"n": 33, "id": "m1000-0033", "meta": 13, "disc": "Processo Penal", "tema": "Incidente de falsidade", "tipo": "FGV · TJ-ES · 2025", "p": "A decisão do incidente de falsidade documental faz coisa julgada (CPP, arts. 145-148)?", "r": "NÃO — QUALQUER QUE SEJA A DECISÃO, NÃO FAZ COISA JULGADA em prejuízo de ulterior processo penal ou civil (art. 148), pois a cognição do incidente é sumária. No rito, a parte contrária responde em 48 HORAS (não 5 dias — art. 145, I) e, reconhecida a falsidade, o documento desentranhado é remetido ao MINISTÉRIO PÚBLICO (art. 145, IV), não à OAB/CNMP. Pegadinha: prazo e destinatário são os alvos da banca.", "d1": "Cognição rasa não trava o futuro.", "d2": "Sem coisa julgada (art. 148); resposta em 48h; documento ao MP.", "nota": "", "errei": false}, {"n": 34, "id": "m1000-0034", "meta": 14, "disc": "Notarial/Registral", "tema": "Marco Legal das Garantias", "tipo": "FGV · Enac · 2025", "p": "Na renegociação de dívida intermediada pelo tabelião de protesto (Lei 14.711/23), quando são devidos os emolumentos?", "r": "SOMENTE SE EXITOSA A SOLUÇÃO NEGOCIAL — os emolumentos da renegociação, a cargo do devedor, dependem do êxito (havendo desconto, calculam-se sobre o efetivamente pago). O Marco Legal das Garantias tornou o tabelião agente da renegociação: o credor pode transferir-lhe o recebimento com desconto ou parcelamento, inclusive após o protesto. Pegadinha: a análise da proposta NÃO é direito subjetivo do devedor.", "d1": "O cartório só cobra se a conversa der certo.", "d2": "Emolumento condicionado ao êxito da negociação.", "nota": "", "errei": false}, {"n": 35, "id": "m1000-0035", "meta": 14, "disc": "Notarial/Registral", "tema": "Letra de câmbio — aceite", "tipo": "FGV · TJ-SE · 2023", "p": "Cabe protesto por falta de pagamento contra o sacado que recusou o aceite da letra de câmbio (LUG, art. 25; Lei 9.492/97, art. 21)?", "r": "NÃO — QUEM NÃO ACEITA NÃO SE OBRIGA CAMBIARIAMENTE: o sacado não aceitante não é devedor da letra, sendo defeso protestá-lo por falta de pagamento (cabível é o protesto por falta de ACEITE). Pegadinha: a abstração não transforma o não aceitante em obrigado, e a recusa do aceite não veda a protocolização nem caduca a ação contra o sacador.", "d1": "Sem a assinatura do aceite, não nasce obrigação cambial.", "d2": "Contra o não aceitante: falta de aceite, nunca falta de pagamento.", "nota": "", "errei": false}, {"n": 36, "id": "m1000-0036", "meta": 14, "disc": "Notarial/Registral", "tema": "Protesto falimentar", "tipo": "Lei 9.492/97", "p": "O tabelião pode lavrar protesto especial falimentar contra fundação de direito privado (Lei 11.101/05, art. 94; Lei 9.492/97, art. 9º)?", "r": "NÃO — DEVE RECUSAR: o protesto especial pressupõe devedor sujeito à legislação falimentar (empresário/sociedade empresária) e título acima de 40 salários mínimos (art. 94, I e §3º, Lei 11.101/05); fundação não é empresária e não quebra. Pegadinha: o art. 9º ('o tabelião não investiga, apenas formaliza') vale para o protesto comum — no falimentar há requisito de qualificação do devedor a verificar.", "d1": "Nem todo devedor pode quebrar.", "d2": "Fundação não é empresária → recusa na modalidade falimentar.", "nota": "", "errei": false}, {"n": 37, "id": "m1000-0037", "meta": 14, "disc": "Notarial/Registral", "tema": "Cancelamento do protesto", "tipo": "Consulplan · TJ-MA · 2023", "p": "Quitada a dívida, de quem é o ônus de promover o cancelamento do protesto, segundo o STJ (Lei 9.492/97, art. 26)?", "r": "DO DEVEDOR — quitada a dívida, cabe a ele ir ao cartório com a prova da quitação e promover o cancelamento (art. 26; STJ). Pegadinha: não confundir com a Súmula 548/STJ, dos cadastros de inadimplentes (SPC/Serasa), em que a baixa em 5 dias úteis é ônus do CREDOR.", "d1": "Protesto e Serasa têm responsáveis diferentes pela baixa.", "d2": "Protesto: devedor cancela; cadastro restritivo: credor baixa (S. 548).", "nota": "", "errei": false}, {"n": 38, "id": "m1000-0038", "meta": 14, "disc": "Notarial/Registral", "tema": "Cancelamento do protesto", "tipo": "IESES · TJ-TO · 2022", "p": "Como se lança o cancelamento quando o protesto está registrado em microfilme ou gravação eletrônica (Lei 9.492/97, art. 26, §4º)?", "r": "EM DOCUMENTO APARTADO, arquivado junto com os documentos que instruíram o pedido e ANOTADO NO ÍNDICE respectivo (art. 26, §4º). Pegadinha: os três distratores clássicos do tema — 'sentença arbitral' (é determinação judicial, §3º), 'somente pelo credor' (é qualquer interessado) e 'somente pelo tabelião titular' (substitutos também praticam).", "d1": "Sem livro físico, o termo precisa de um suporte próprio.", "d2": "Documento apartado + anotação no índice.", "nota": "", "errei": false}, {"n": 39, "id": "m1000-0039", "meta": 14, "disc": "Notarial/Registral", "tema": "Certidões do protesto", "tipo": "IESES · TJ-AM · 2023", "p": "A certidão diária fornecida às entidades de proteção ao crédito pode ganhar publicidade pela imprensa (Lei 9.492/97, art. 29)?", "r": "NÃO — É INFORMAÇÃO RESERVADA, sem publicidade pela imprensa (art. 29). Certidões comuns saem em até 5 dias úteis abrangendo no mínimo os 5 anos anteriores (art. 27); cancelamentos averbados não constam, salvo requerimento escrito do devedor ou ordem judicial (art. 27, §1º); protestos não cancelados são certificáveis a qualquer interessado que requeira por escrito (art. 31). Pegadinha: a banca tenta 'abrir' pela imprensa a publicidade que a lei expressamente fechou.", "d1": "A publicidade do protesto tem uma exceção famosa.", "d2": "Certidão diária às entidades de crédito = reservada (art. 29).", "nota": "", "errei": false}, {"n": 40, "id": "m1000-0040", "meta": 14, "disc": "Notarial/Registral", "tema": "Livros e arquivos", "tipo": "IESES · TJ-AM · 2023", "p": "Quem pode abrir e encerrar os livros de Registros de Protesto (Lei 9.492/97, art. 33)?", "r": "TABELIÃO, SUBSTITUTOS OU AINDA ESCREVENTE AUTORIZADO — o 'somente pelo Tabelião ou seus Substitutos' amputa o terceiro legitimado do art. 33. Lembre também: responsabilidade civil por culpa ou dolo com direito de regresso (art. 38); protocolo arquiva-se por 3 anos, registros e títulos por 10, e intimações/editais/ordens de cancelamento por ao menos 1 ano. Pegadinha: 'somente' reproduzindo texto de lei quase sempre é o erro.", "d1": "A lista de legitimados tem três degraus, não dois.", "d2": "O 'somente' cortou o escrevente autorizado.", "nota": "", "errei": false}, {"n": 41, "id": "m1000-0041", "meta": 14, "disc": "Notarial/Registral", "tema": "Central nacional (art. 41-A)", "tipo": "CONSULPLAN · TJ-AC · 2023", "p": "A consulta a devedores inadimplentes e protestos na central nacional de serviços eletrônicos é paga ou gratuita (Lei 9.492/97, art. 41-A)?", "r": "GRATUITA — a central nacional presta consulta GRATUITA quanto a devedores inadimplentes e aos protestos realizados; também faz escrituração e emissão de duplicata escritural (com autorização prévia do órgão supervisor), recepção e distribuição de títulos escriturais, confirmação de autenticidade em meio eletrônico e anuência eletrônica para cancelamento (art. 41-A). Pegadinha: cace os pares gratuita/paga e escritural/cartular — é onde a banca mexe.", "d1": "O distrator foi um adjetivo sobre o custo.", "d2": "Consulta gratuita; recepção/distribuição só de escriturais.", "nota": "", "errei": false}, {"n": 42, "id": "m1000-0042", "meta": 14, "disc": "Notarial/Registral", "tema": "Local de prestação", "tipo": "IESES · TJ-PA · 2026", "p": "Quem fixa os dias e horários de funcionamento da serventia (Lei 8.935/94, art. 4º)?", "r": "O JUÍZO COMPETENTE, atendidas as peculiaridades locais — os serviços são prestados de modo eficiente e adequado, em local de fácil acesso ao público e que ofereça segurança para o arquivamento de livros e documentos (art. 4º, caput). Pegadinha: não é 'exclusivamente o titular' quem define, o atendimento mínimo é de 6 horas diárias (§2º) e sucursal não se abre sem autorização.", "d1": "A autonomia do titular tem um limite institucional.", "d2": "Juízo competente fixa dias e horários.", "nota": "", "errei": false}, {"n": 43, "id": "m1000-0043", "meta": 14, "disc": "Notarial/Registral", "tema": "Fé pública notarial", "tipo": "IESES · TJ-TO · 2022", "p": "A fé pública dos notários e registradores é mera construção doutrinária ou tem previsão legal expressa?", "r": "TEM PREVISÃO LEGAL EXPRESSA — o art. 3º da Lei 8.935/94 declara notários e registradores 'profissionais do direito, dotados de fé pública', e o exercício da atividade se dá em caráter PRIVADO, por delegação do Poder Público (CF, art. 236). Pegadinha: a banca chama a fé pública de 'mera construção doutrinária' — sabendo que o art. 3º existe, a tese cai por inteiro.", "d1": "Há um artigo específico que encerra a discussão.", "d2": "Art. 3º da Lei 8.935/94 + CF, art. 236.", "nota": "", "errei": false}, {"n": 44, "id": "m1000-0044", "meta": 15, "disc": "Civil", "tema": "Teoria da imprevisão", "tipo": "Cespe · TJ-RO · 2025", "p": "Quais eventos o STJ aceita como fato extraordinário e imprevisível para a teoria da imprevisão (CC, art. 478)?", "r": "A PANDEMIA COM DRÁSTICA QUEDA DE FATURAMENTO — choque externo genuinamente extraordinário e imprevisível. Pegadinha: estiagem e pragas em contrato agrícola são risco inerente da atividade, variação de cotação em derivativos/swap é álea normal do próprio negócio e dissídio coletivo é previsível e ordinário — nenhum autoriza a imprevisão (STJ).", "d1": "Risco do ramo não conta; conta o choque de fora.", "d2": "Só a pandemia passa no teste do extraordinário.", "nota": "", "errei": false}, {"n": 45, "id": "m1000-0045", "meta": 15, "disc": "Civil", "tema": "Contrato preliminar", "tipo": "FGV · TJ-SE · 2023", "p": "O registro é requisito de validade do contrato preliminar (CC, arts. 462-463; Súmula 239/STJ)?", "r": "NÃO — O PRELIMINAR VALE E É EXIGÍVEL ENTRE AS PARTES SEM REGISTRO; o registro serve apenas à oponibilidade perante terceiros (e, na promessa irretratável, ao direito real à aquisição). A obrigação de concluir o definitivo existe sem registro (arts. 462-463; Enunciado 30 CJF) e a adjudicação compulsória independe de registro (Súmula 239/STJ). Pegadinha: confundir o plano da validade com o da eficácia perante terceiros.", "d1": "Registro é para o mundo, não para as partes.", "d2": "Válido entre as partes sem registro; Súmula 239/STJ.", "nota": "", "errei": false}, {"n": 46, "id": "m1000-0046", "meta": 15, "disc": "Civil", "tema": "Inadimplemento antecipado", "tipo": "Consulplan · TJ-MA · 2023", "p": "Antes do vencimento, já evidente que o devedor não cumprirá, o que o credor pode fazer (inadimplemento antecipado)?", "r": "PEDIR DESDE LOGO A EXTINÇÃO DO PACTO com devolução do que antecipou — teoria do inadimplemento antecipado (anticipatory breach), acolhida pelo STJ: quebra certa antes do termo já é quebra (CC, art. 475). Pegadinha: preço ao arbítrio exclusivo de uma parte é nulo (art. 489); chuvas, pragas e oscilação de preço são riscos previsíveis que NÃO autorizam revisão (STJ); safra futura não é obrigação personalíssima.", "d1": "Não se espera o calendário confirmar o óbvio.", "d2": "Quebra antecipada — extinção + devolução do antecipado.", "nota": "", "errei": false}, {"n": 47, "id": "m1000-0047", "meta": 15, "disc": "Civil", "tema": "Estipulação em favor de terceiro", "tipo": "Vunesp · TJ-SP · 2022", "p": "O estipulante pode substituir o terceiro beneficiário sem anuência dele ou do outro contratante (CC, art. 438)?", "r": "SIM — LIVREMENTE: o estipulante pode reservar-se o direito de substituir o terceiro designado, independentemente da anuência deste e do outro contratante (art. 438), figura típica dos seguros de vida. Pegadinhas vizinhas: no vício redibitório com posse anterior o prazo conta da alienação reduzido à METADE, não a um terço (art. 445); a nomeação no contrato com pessoa a declarar retroage à celebração (art. 469); e o evicto que ignorava o risco recebe o preço mesmo com cláusula de exclusão (art. 449).", "d1": "Pense em quem troca o beneficiário do seguro de vida.", "d2": "Substituição livre, sem anuência de ninguém (art. 438).", "nota": "", "errei": false}, {"n": 48, "id": "m1000-0048", "meta": 15, "disc": "Civil", "tema": "Assinatura a rogo", "tipo": "Vunesp · TJ-GO · 2021", "p": "Como o analfabeto contrata validamente empréstimo consignado (CC, art. 595; STJ)?", "r": "POR ASSINATURA A ROGO COM DUAS TESTEMUNHAS ou procuração por instrumento público — o analfabeto é plenamente capaz, mas quem não sabe ler/escrever assina por outrem a rogo (art. 595 CC), e a impressão digital isolada é insuficiente para o STJ (REsp 1.868.099, Inf. 684). Pegadinha: alternativas que negam capacidade negocial ou exigem interdição são falsas.", "d1": "Capacidade plena; o problema é só a forma de manifestar a vontade.", "d2": "A rogo + 2 testemunhas; digital sozinha não basta.", "nota": "", "errei": false}, {"n": 49, "id": "m1000-0049", "meta": 15, "disc": "Civil", "tema": "Compra e venda", "tipo": "Ieses · TJ-PA · 2026", "p": "Quando a compra e venda pura se considera obrigatória e perfeita (CC, art. 482)?", "r": "COM O ACORDO SOBRE COISA E PREÇO (art. 482) — prazo de entrega NÃO é elemento de perfeição. O efeito é meramente obrigacional: o domínio só se transfere pela tradição ou registro. Pegadinha: a banca troca os elementos essenciais por 'prazo de entrega da coisa e do preço'; os arts. 481, 483 (coisa futura/contrato aleatório) e 484 (venda por amostra) caem em redação literal.", "d1": "Dois elementos essenciais, e nenhum é temporal.", "d2": "Coisa + preço (art. 482).", "nota": "", "errei": false}, {"n": 50, "id": "m1000-0050", "meta": 15, "disc": "Civil", "tema": "Compromisso de compra e venda", "tipo": "Cespe · TJ-RO · Cartórios · Ingresso · 2025", "p": "A prescrição das parcelas do saldo devedor dispensa o promitente comprador de quitar o preço para obter a escritura (STJ; CC, arts. 463-464)?", "r": "NÃO — PRESCRIÇÃO NÃO É PAGAMENTO: o pleito é de OBRIGAÇÃO DE FAZER (outorga da escritura definitiva) e permanece condicionado à quitação integral do preço, ainda que prescrita a pretensão de cobrança das parcelas (STJ, REsp 2.207.433-SP). Pegadinha: além de inverter o efeito da prescrição, a banca cobra o rótulo — o STJ trata o pedido como obrigação de fazer, não como adjudicação compulsória.", "d1": "Extinguir a cobrança não apaga a dívida como contraprestação.", "d2": "Obrigação de fazer + quitação integral, mesmo prescritas as parcelas.", "nota": "", "errei": false}, {"n": 51, "id": "m1000-0051", "meta": 15, "disc": "Civil", "tema": "Condomínio — preferência do condômino", "tipo": "FGV · TJ-SC · Cartórios · Remoção · 2021", "p": "Qual o direito do condômino preterido quando outro condômino vende sua parte a estranho, e em que prazo (CC, art. 504)?", "r": "HAVER PARA SI A PARTE VENDIDA, DEPOSITANDO O PREÇO, no prazo DECADENCIAL de 180 DIAS contados do REGISTRO da venda no RI (art. 504, CC) — é adjudicação da quota, não mera indenização. Pegadinha: as erradas trocam por indenização, prazo prescricional de 3 anos ou termo inicial na escritura.", "d1": "O condômino preterido não recebe dinheiro — ele toma algo para si.", "d2": "Haver para si + depósito do preço + 180 dias decadenciais do registro.", "nota": "", "errei": false}, {"n": 52, "id": "m1000-0052", "meta": 15, "disc": "Civil", "tema": "Prescrição — renúncia e prazo quinquenal", "tipo": "FGV · TJ-ES · Cartórios · Remoção · 2025", "p": "A renúncia à prescrição feita depois de iniciado o prazo é válida? E qual o prazo para cobrar dívida líquida em instrumento particular (CC, arts. 191 e 206, §5º, I)?", "r": "SIM — A RENÚNCIA POSTERIOR AO INÍCIO DO PRAZO É VÁLIDA (art. 191, CC); só a renúncia prévia é vedada. A dívida líquida em instrumento particular prescreve em 5 ANOS (art. 206, §5º, I). Pegadinha: a renúncia salva a cobrança, mas não ressuscita a opção de forma de pagamento que já decaiu no prazo contratual.", "d1": "O momento da renúncia decide tudo: antes ou depois de o prazo começar a correr?", "d2": "Depois de iniciado o prazo, vale; dívida líquida particular = 5 anos.", "nota": "", "errei": false}, {"n": 53, "id": "m1000-0053", "meta": 15, "disc": "Civil", "tema": "Propriedade ad tempus / revogável", "tipo": "FGV · TJ-SE · Cartórios · Remoção · 2023", "p": "O que é a propriedade ad tempus e qual seu exemplo clássico (CC, arts. 1.359 e 1.360)?", "r": "É A PROPRIEDADE REVOGÁVEL POR CAUSA SUPERVENIENTE, COM EFEITOS EX NUNC — exemplo clássico: a revogação da doação por ingratidão (arts. 555 e ss. c/c 1.360, CC), que não retroage nem prejudica terceiros de boa-fé. Pegadinha: retrovenda, fideicomisso, alienação fiduciária e venda a contento são propriedade resolúvel com causa já no título (art. 1.359) — efeito ex tunc.", "d1": "A causa da resolução não estava no título — apareceu depois.", "d2": "Causa superveniente + ex nunc = revogação da doação por ingratidão.", "nota": "", "errei": false}, {"n": 54, "id": "m1000-0054", "meta": 16, "disc": "Empresarial", "tema": "Limitada — uso do nome empresarial", "tipo": "FGV · TJ-SC · Cartórios · Ingresso · 2021", "p": "Na sociedade limitada, quem pode usar o nome empresarial para obrigar a sociedade, e cabe constituir mandatário (CC, arts. 1.064 e 1.018)?", "r": "É PRIVATIVO DOS ADMINISTRADORES COM OS NECESSÁRIOS PODERES (art. 1.064, CC), MAS o administrador PODE constituir mandatários da sociedade, especificando no instrumento os atos e operações (art. 1.018, CC). Pegadinha: a alternativa que começa certa e nega a possibilidade de mandatário contraria o art. 1.018.", "d1": "Privativo de quem administra — mas a lei abre uma porta de delegação formal.", "d2": "Administrador com poderes + mandatário admitido nos limites (art. 1.018).", "nota": "", "errei": false}, {"n": 55, "id": "m1000-0055", "meta": 16, "disc": "Empresarial", "tema": "Operações societárias — fusão", "tipo": "Cespe · TJ-RR · Cartórios · Ingresso · 2025", "p": "Como se chama a operação em que duas ou mais sociedades se unem formando sociedade NOVA que as sucede (CC, art. 1.119; LSA, art. 228)?", "r": "FUSÃO — duas ou mais sociedades se unem para formar sociedade nova, que lhes sucede em todos os direitos e obrigações (art. 1.119, CC; art. 228, LSA). Pegadinha: na incorporação uma sociedade JÁ EXISTENTE absorve outra(s), sem nascer sociedade nova.", "d1": "O detalhe decisivo: nasce ou não nasce uma sociedade nova?", "d2": "Sociedade nova sucedendo as antigas = fusão (incorporação é absorção).", "nota": "", "errei": false}, {"n": 56, "id": "m1000-0056", "meta": 16, "disc": "Empresarial", "tema": "Trespasse e estabelecimento", "tipo": "Cespe · TJ-RO · Cartórios · Ingresso · 2025", "p": "Quais as condições de eficácia do trespasse perante terceiros (CC, art. 1.144)?", "r": "AVERBAÇÃO/REGISTRO NA JUNTA COMERCIAL + PUBLICAÇÃO NA IMPRENSA OFICIAL, cumulativos (art. 1.144, CC). Pegadinha: o consentimento dos credores (quando os bens não bastam ao passivo) pode ser expresso OU TÁCITO — silêncio em 30 dias após notificação (art. 1.145); e estabelecimento é complexo de bens (materiais e imateriais), não o local físico (art. 1.142).", "d1": "São dois requisitos somados para valer contra terceiros.", "d2": "Registro na Junta + publicação oficial (art. 1.144).", "nota": "", "errei": false}, {"n": 57, "id": "m1000-0057", "meta": 16, "disc": "Empresarial", "tema": "Arrendamento mercantil — natureza", "tipo": "Consulplan · TJ-MA · Ingresso · 2023", "p": "Qual a natureza jurídica do arrendamento mercantil segundo os tribunais superiores?", "r": "CONTRATO COMPLEXO, com características de LOCAÇÃO, PROMESSA UNILATERAL DE VENDA E FINANCIAMENTO — e o pagamento dos aluguéis NÃO transfere a propriedade ao arrendatário. Pegadinha: não é comodato, nem compra e venda com garantia, e a jurisprudência não descaracteriza o leasing pela cobrança antecipada do VRG.", "d1": "É um contrato que mistura três figuras contratuais.", "d2": "Locação + promessa unilateral de venda + financiamento; aluguel não vira propriedade.", "nota": "", "errei": false}, {"n": 58, "id": "m1000-0058", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPN — retificação administrativa", "tipo": "IESES · TJ-AM · Remoção · 2023", "p": "A retificação administrativa de erro evidente no registro civil depende de prévia manifestação do MP (LRP, art. 110)?", "r": "NÃO — após a Lei 14.382/2022, o erro evidente é corrigido DE OFÍCIO pelo próprio oficial, sem prévia chancela do MP (que é apenas cientificado), vedado prejuízo a terceiros e com ciência ao interessado (LRP, art. 110). Pegadinha: antes da Lei 14.382/2022 dependia de MP/juiz — a banca cobra o regime novo.", "d1": "O Marco da Desjudicialização mudou quem corrige o erro evidente.", "d2": "De ofício pelo oficial; MP só é cientificado.", "nota": "", "errei": false}, {"n": 59, "id": "m1000-0059", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPJ — conteúdo do registro", "tipo": "IESES · TJ-TO · Ingresso · 2022", "p": "O que deve constar no registro da pessoa jurídica no RCPJ (LRP, arts. 114 e 120)?", "r": "TUDO: DENOMINAÇÃO, FINS, SEDE, TEMPO DE DURAÇÃO, MODO DE ADMINISTRAÇÃO E REPRESENTAÇÃO, CONDIÇÕES DE EXTINÇÃO E DESTINO DO PATRIMÔNIO (LRP, arts. 114 e 120) — inclusive os atos constitutivos das fundações. Pegadinha: a tentação é procurar um pega inexistente — todos esses itens são literais da lei, nenhum fica de fora.", "d1": "A lista do art. 120 é longa — vai da denominação até o fim da pessoa jurídica.", "d2": "Todos os itens (fins, sede, duração, administração, extinção, patrimônio) constam.", "nota": "", "errei": false}, {"n": 60, "id": "m1000-0060", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPN — adoção", "tipo": "FGV · TJ-SC · Remoção · 2021", "p": "Como a adoção repercute no registro civil do adotado (ECA, art. 47)?", "r": "SENTENÇA + MANDADO + NOVO REGISTRO + CANCELAMENTO DO REGISTRO ORIGINAL (que fica arquivado) — e nenhuma observação sobre a origem adotiva pode constar do novo assento ou da certidão (ECA, art. 47). Pegadinha: adoção NÃO é averbação à margem do registro antigo — é registro novo com cancelamento do anterior.", "d1": "O assento antigo não sobrevive com anotações — o destino dele é mais radical.", "d2": "Novo registro + cancelamento do original, por mandado, sem mencionar a adoção.", "nota": "", "errei": false}, {"n": 61, "id": "m1000-0061", "meta": 17, "disc": "Notarial/Registral", "tema": "RTD — autenticidade das assinaturas", "tipo": "FGV · TJ-ES · Remoção · 2025", "p": "No RTD, quem responde pela autenticidade das assinaturas do documento apresentado a registro (LRP, art. 161)?", "r": "O APRESENTANTE — o oficial registra o que lhe é apresentado sem garantir a veracidade das firmas (LRP, art. 161), e o registro dá publicidade e data certa, mas NÃO convalida eventual falsidade. Pegadinha: não se exige reconhecimento de firma como condição geral do registro, nem há solidariedade com o oficial.", "d1": "O oficial do RTD não é fiscal de firmas — o ônus é de quem leva o documento.", "d2": "Responsabilidade do apresentante; registro não convalida falsidade.", "nota": "", "errei": false}, {"n": 62, "id": "m1000-0062", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPJ — objeto ilícito / dúvida", "tipo": "VUNESP · TJ-SP · Remoção · 2024", "p": "O que faz o oficial do RCPJ diante de estatuto com objeto nocivo ou contrário à lei (LRP, art. 115)?", "r": "SOBRESTA O REGISTRO E SUSCITA DÚVIDA, DE OFÍCIO, AO JUIZ competente/corregedor permanente (LRP, art. 115) — a recusa não é arbitrária, submete-se ao crivo judicial. Pegadinha: a dúvida no RCPJ é suscitada DE OFÍCIO pelo oficial, diferente da dúvida no RI, em regra provocada a requerimento do apresentante.", "d1": "Ele não registra, mas também não arquiva por conta própria — chama um terceiro.", "d2": "Sobresta + dúvida de ofício ao juiz (art. 115).", "nota": "", "errei": false}, {"n": 63, "id": "m1000-0063", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPJ — impedimento de administrador", "tipo": "VUNESP · TJ-GO · Remoção · 2021", "p": "Quem está impedido de ser administrador de pessoa jurídica (CC, art. 1.011, §1º)?", "r": "O CONDENADO POR CRIME CUJA PENA VEDE ACESSO A CARGO PÚBLICO, OU POR CRIME FALIMENTAR, PECULATO, CONTRA A ECONOMIA POPULAR, O SISTEMA FINANCEIRO, AS RELAÇÕES DE CONSUMO, A FÉ PÚBLICA OU A PROPRIEDADE — enquanto perdurarem os efeitos da condenação (CC, art. 1.011, §1º). Pegadinha: a lista é fechada e o impedimento não é perpétuo; idade de 21 anos, residência em outra comarca e outra atividade empresarial não impedem.", "d1": "O impedimento vem de condenação criminal específica, com prazo de validade.", "d2": "Crimes do art. 1.011, §1º, enquanto durarem os efeitos da condenação.", "nota": "", "errei": false}, {"n": 64, "id": "m1000-0064", "meta": 17, "disc": "Notarial/Registral", "tema": "RTD — autenticidade das assinaturas", "tipo": "FGV · Enac · 2025", "p": "Quem responde pela autenticidade das assinaturas de terceiros em documento (ex.: carta de fiança) levado ao RTD (LRP, art. 161)?", "r": "EXCLUSIVAMENTE O APRESENTANTE — o oficial registra o título sem garantir a veracidade das firmas (LRP, art. 161). A fé pública do RTD é relativa quanto às assinaturas: a falsidade pode ser apurada e não é sanada pelo registro. Pegadinha: não há solidariedade com os signatários nem responsabilidade do credor beneficiário.", "d1": "Mesmo com assinaturas de terceiros, o ônus continua com uma só pessoa.", "d2": "Exclusivamente o apresentante.", "nota": "", "errei": false}, {"n": 65, "id": "m1000-0065", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPJ — matrícula de jornais", "tipo": "IESES · TJ-TO · Ingresso · 2022", "p": "Como funciona a matrícula de jornais e publicações periódicas no RCPJ (LRP, arts. 122-126)?", "r": "É OBRIGATÓRIA, com as informações exigidas em lei (inclusive diretor/redator responsável), ALTERAÇÕES AVERBADAS EM 8 DIAS e CADA DECLARAÇÃO correspondendo a UM REQUERIMENTO (LRP, arts. 122-126). Pegadinha: sem matrícula, o veículo presume-se clandestino — não é facultativa e as alterações não dispensam averbação.", "d1": "Três engrenagens: o que consta, o prazo das mudanças e a forma do pedido.", "d2": "Obrigatória + averbação em 8 dias + uma declaração por requerimento.", "nota": "", "errei": false}, {"n": 66, "id": "m1000-0066", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPJ — rol do art. 114", "tipo": "IESES · TJ-AM · Ingresso · 2023", "p": "Que entidades têm seus atos constitutivos inscritos no RCPJ (LRP, art. 114, I)?", "r": "SOCIEDADES CIVIS, RELIGIOSAS, PIAS, MORAIS, CIENTÍFICAS OU LITERÁRIAS, FUNDAÇÕES E ASSOCIAÇÕES DE UTILIDADE PÚBLICA (LRP, art. 114, I) — o RCPJ ainda matricula jornais, oficinas impressoras, radiodifusão e agências de notícias (art. 114, II e III). Pegadinha: sociedades empresárias e empresário individual vão à JUNTA COMERCIAL; desconfie de \"exclusivamente\" e \"apenas\".", "d1": "O rol é amplo — o erro das alternativas está em restringir ou incluir entes empresariais.", "d2": "Civis, religiosas, pias, científicas, literárias + fundações + associações.", "nota": "", "errei": false}, {"n": 67, "id": "m1000-0067", "meta": 17, "disc": "Notarial/Registral", "tema": "RCPN — registro × averbação", "tipo": "IESES · TJ-TO · Ingresso · 2022", "p": "Nascimento, óbito, emancipação, interdição, ausência e opção de nacionalidade são objeto de registro ou de averbação (LRP, art. 29)?", "r": "DE REGISTRO — o caput do art. 29 da LRP lista nascimento, casamento, óbito, emancipação, interdição, ausência, opção de nacionalidade e legitimação adotiva como atos REGISTRADOS, não averbados. Pegadinha: a banca enfileira os atos do caput e troca o verbo \"registrar\" por \"averbar\" — atenção ao verbo.", "d1": "A lista está no caput do art. 29 — a armadilha é o verbo, não a lista.", "d2": "Todos esses atos se REGISTRAM (art. 29).", "nota": "", "errei": false}, {"n": 68, "id": "m1000-0068", "meta": 18, "disc": "Constitucional", "tema": "MS — lei em tese", "tipo": "CESPE · TJ/SC · 2023", "p": "Cabe mandado de segurança contra lei em tese (Súmula 266/STF)?", "r": "NÃO — não cabe MS contra ato normativo em abstrato (Súmula 266/STF): impetração contra lei em tese leva à extinção sem resolução de mérito por inadequação da via. Pegadinha: o MS coletivo de associação DISPENSA autorização expressa dos associados (Súmula 629/STF) e PODE tutelar direitos individuais homogêneos — esses distratores não são o motivo da extinção.", "d1": "O problema não estava na associação nem nos direitos tutelados — estava no alvo do MS.", "d2": "Lei em tese não se ataca por MS (Súmula 266/STF).", "nota": "Você errou esta na Meta 18. Marcou B; gabarito D.", "errei": true}, {"n": 69, "id": "m1000-0069", "meta": 18, "disc": "Constitucional", "tema": "Remédios constitucionais — objetos", "tipo": "CESPE · TJ/RO · 2025", "p": "O habeas data serve para obter vista de processo administrativo? E o HC protege liberdade coletiva de ir e vir (CF, art. 5º)?", "r": "NÃO E NÃO — o HD destina-se a conhecimento, retificação e anotação de DADOS PESSOAIS, não a vista de processo (isso é direito de petição/certidão); e, na assertiva acolhida pela banca, o HC não é o meio adequado para a liberdade COLETIVA de ir e vir. Pegadinha: o MI não impõe sanção pecuniária ao Congresso pela mora, e o cumprimento do MS não depende de aquiescência da autoridade coatora.", "d1": "Cada remédio tem objeto próprio — não misture HD com certidão nem MI com multa.", "d2": "HD = dados pessoais (não vista de processo); a correta nega o HC coletivo.", "nota": "Você errou esta na Meta 18. Marcou E; gabarito A.", "errei": true}, {"n": 70, "id": "m1000-0070", "meta": 18, "disc": "Constitucional", "tema": "MS — suspensão de segurança", "tipo": "IESES · TJ/TO · 2022", "p": "Quem pode suspender liminar ou sentença concessiva de MS e a que pedido (Lei 12.016/09, art. 15)?", "r": "O PRESIDENTE DO TRIBUNAL A QUE COUBER O RECURSO — em regra o Presidente do STJ na matéria infraconstitucional —, a requerimento do PGR ou da PESSOA JURÍDICA DE DIREITO PÚBLICO interessada, para evitar grave lesão à ORDEM, SAÚDE, SEGURANÇA E ECONOMIA públicas (Lei 12.016/09, art. 15). Pegadinha: as demais alternativas distorcem prazos e tempos de sustentação do procedimento.", "d1": "A competência segue o destino do recurso; os legitimados são dois.", "d2": "Presidente do tribunal do recurso, a pedido do PGR ou da PJ de direito público.", "nota": "Você errou esta na Meta 18. Marcou C; gabarito A.", "errei": true}, {"n": 71, "id": "m1000-0071", "meta": 18, "disc": "Constitucional", "tema": "ADPF — estado de coisas inconstitucional", "tipo": "FGV · TJ/SE · 2023", "p": "O que é o estado de coisas inconstitucional e por qual via o STF o reconhece (CF, art. 102, §1º)?", "r": "VIOLAÇÃO MASSIVA E ESTRUTURAL DE DIREITOS FUNDAMENTAIS por omissões reiteradas dos poderes públicos, reconhecível em ADPF com expedição de ordens estruturais (CF, art. 102, §1º; Lei 9.882/99) — caso da população em situação de rua, com pedido DEFERIDO. Pegadinha: não se indefere por violação ao princípio federativo/republicano nem se exige ADO em vez de ADPF.", "d1": "Omissões reiteradas + violação estrutural têm nome próprio na jurisprudência.", "d2": "Estado de coisas inconstitucional — deferido via ADPF.", "nota": "Você errou esta na Meta 18. Marcou E; gabarito C.", "errei": true}, {"n": 72, "id": "m1000-0072", "meta": 18, "disc": "Constitucional", "tema": "MS coletivo — legitimados", "tipo": "IESES · TJ/TO · 2022", "p": "Quem pode impetrar mandado de segurança coletivo (CF, art. 5º, LXX)?", "r": "PARTIDO POLÍTICO COM REPRESENTAÇÃO NO CONGRESSO NACIONAL e ORGANIZAÇÃO SINDICAL, ENTIDADE DE CLASSE OU ASSOCIAÇÃO constituída e em funcionamento há pelo menos 1 ANO, em defesa dos membros ou associados (CF, art. 5º, LXX). Pegadinhas vizinhas: Ministro do STM não é cargo privativo de nato (art. 12, §3º), não cabe HC contra punição disciplinar militar (art. 142, §2º) e a lei eleitoral vige na publicação, só não se aplicando à eleição no prazo de 1 ano.", "d1": "Dois blocos de legitimados: um político, outro associativo com prazo mínimo.", "d2": "Partido com representação no CN + sindicato/classe/associação de 1 ano.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito C.", "errei": true}, {"n": 73, "id": "m1000-0073", "meta": 18, "disc": "Constitucional", "tema": "Remédios — gratuidade", "tipo": "IESES · TJ/TO · 2022", "p": "Quais ações constitucionais são gratuitas por força da CF (art. 5º, LXXVII)?", "r": "SÓ HABEAS CORPUS E HABEAS DATA (CF, art. 5º, LXXVII) — mandado de segurança e mandado de injunção NÃO têm gratuidade constitucionalmente garantida. Pegadinha: incluir MS ou MI entre as ações gratuitas é o erro clássico.", "d1": "São apenas dois, e ambos começam com a mesma palavra.", "d2": "HC e HD — nada de MS ou MI.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito C.", "errei": true}, {"n": 74, "id": "m1000-0074", "meta": 18, "disc": "Constitucional", "tema": "Controle concentrado — legitimidade ativa", "tipo": "CESPE · TJ/SC · 2023", "p": "Partido político tem capacidade postulatória própria no controle concentrado (CF, art. 103)?", "r": "NÃO — o partido com representação no Congresso precisa de ADVOGADO para propor ação de controle concentrado, ao contrário dos legitimados que postulam por si. Pegadinhas: não há requisito de \"associados em 8 estados\" para ADC, o CNMP NÃO é legitimado e o Estado-membro também não (legitimados são o Governador e a Assembleia Legislativa).", "d1": "A pergunta é quem assina a petição — nem todo legitimado dispensa procurador.", "d2": "Partido político precisa de advogado (sem capacidade postulatória própria).", "nota": "Você errou esta na Meta 18. Marcou B; gabarito D.", "errei": true}, {"n": 75, "id": "m1000-0075", "meta": 18, "disc": "Constitucional", "tema": "ADI estadual — recurso", "tipo": "CESPE · TJ/RR · 2025", "p": "Cabe recurso da decisão do TJ em ADI estadual contra lei municipal (CF, art. 102, III)?", "r": "CABE RECURSO EXTRAORDINÁRIO AO STF APENAS SE O PARÂMETRO FOR NORMA DE REPRODUÇÃO OBRIGATÓRIA da CF nas constituições estaduais, alegando-se violação à norma de repetição obrigatória (CF, art. 102, III). Pegadinha: NÃO cabe recurso especial (controle de constitucionalidade não é matéria de REsp) e a decisão não é irrecorrível.", "d1": "Só um recurso serve, e só se o parâmetro tiver uma qualidade especial.", "d2": "RE ao STF, se o parâmetro for norma de reprodução obrigatória.", "nota": "", "errei": false}, {"n": 76, "id": "m1000-0076", "meta": 18, "disc": "Constitucional", "tema": "Mandado de injunção — cabimento", "tipo": "CESPE · TJ/RR · 2025", "p": "Para que serve o mandado de injunção (CF, art. 5º, LXXI; Lei 13.300/16)?", "r": "PARA COMBATER A OMISSÃO ESTATAL EM LEGISLAR — ausência de norma regulamentadora que inviabilize direitos, liberdades constitucionais e prerrogativas da nacionalidade, soberania e cidadania (CF, art. 5º, LXXI). Pegadinha: norma JÁ existente mas insuficiente não enseja MI (pressupõe AUSÊNCIA de norma), o MI não altera lei, e a omissão deve decorrer de comando CONSTITUCIONAL, não infraconstitucional.", "d1": "O pressuposto é um vazio normativo, não uma norma ruim.", "d2": "Ausência de norma regulamentadora de comando constitucional.", "nota": "Você errou esta na Meta 18. Marcou E; gabarito A.", "errei": true}, {"n": 77, "id": "m1000-0077", "meta": 18, "disc": "Constitucional", "tema": "Mandado de injunção — extensão de efeitos", "tipo": "FGV · TJ/SE · 2023", "p": "Transitada em julgado a decisão do MI, como os efeitos podem alcançar casos análogos (Lei 13.300/16, art. 9º)?", "r": "POR DECISÃO MONOCRÁTICA DO RELATOR — a Lei do MI prevê expressamente a extensão dos efeitos aos casos análogos após o trânsito em julgado (art. 9º, §§1º e 2º, Lei 13.300/16). Pegadinha: não é eficácia erga omnes automática, não depende de aquiescência do poder público e não se limita às partes.", "d1": "A extensão existe, mas passa por um ato de um único julgador.", "d2": "Relator estende monocraticamente aos casos análogos, após o trânsito.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito B.", "errei": true}, {"n": 78, "id": "m1000-0078", "meta": 18, "disc": "Constitucional", "tema": "ADI — embargos de declaração", "tipo": "CESPE · TJ/RR · 2025", "p": "Quem tem legitimidade para opor embargos de declaração em ADI, segundo o STF?", "r": "O ADVOGADO-GERAL DA UNIÃO — porque atua no processo como defensor da norma impugnada (CF, art. 103, §3º). Pegadinha: o amicus curiae, em regra, NÃO tem legitimidade recursal (salvo contra a decisão que indefere seu ingresso), pessoas naturais não têm interesse recursal no processo objetivo e a legitimidade pressupõe ter atuado como parte.", "d1": "Quem defende a norma no processo objetivo também pode embargá-lo.", "d2": "AGU embarga; amicus curiae, em regra, não recorre.", "nota": "Você errou esta na Meta 18. Marcou A; gabarito C.", "errei": true}, {"n": 79, "id": "m1000-0079", "meta": 18, "disc": "Constitucional", "tema": "ADI/ADC — legitimados", "tipo": "IESES · TJ/TO · 2022", "p": "Deputado Federal ou Senador, isoladamente, pode propor ADI/ADC (CF, art. 103)?", "r": "NÃO — a legitimidade é das MESAS da Câmara e do Senado, não do parlamentar individual (CF, art. 103); OAB, Governador e Presidente da República integram o rol. Pegadinha: confundir o parlamentar isolado com a Mesa da respectiva Casa.", "d1": "O órgão da Casa legisla no rol; o membro sozinho, não.", "d2": "Mesa da Câmara/Senado sim; parlamentar isolado não.", "nota": "", "errei": false}, {"n": 80, "id": "m1000-0080", "meta": 18, "disc": "Constitucional", "tema": "ADPF 54 — anencefalia", "tipo": "VUNESP · TJ/SP · 2022", "p": "Qual a tese do STF sobre a antecipação terapêutica do parto de feto anencefálico (ADPF 54)?", "r": "NÃO SE CONFUNDE COM O ABORTO TIPIFICADO NO CP — o feto anencefálico não tem potencialidade de vida viável, logo a conduta é ATÍPICA (ADPF 54). Pegadinha: não é aborto \"relativizado pela jurisprudência\" nem extensão da descriminalização a outras hipóteses.", "d1": "A tese vencedora tirou o caso do alcance do tipo penal, não o flexibilizou.", "d2": "Antecipação terapêutica de anencéfalo = conduta atípica, não aborto.", "nota": "Você errou esta na Meta 18. Marcou B; gabarito C.", "errei": true}, {"n": 81, "id": "m1000-0081", "meta": 18, "disc": "Constitucional", "tema": "MS — recurso ordinário", "tipo": "FGV · TJ/ES · 2025", "p": "Qual recurso de fundamentação LIVRE cabe contra acórdão denegatório de tribunal em causa originária não criminal, e o que isso revela sobre a causa (CF, art. 105, II, b)?", "r": "O RECURSO ORDINÁRIO CONSTITUCIONAL AO STJ — próprio do MANDADO DE SEGURANÇA denegado em única instância pelos tribunais (CF, art. 105, II, b); logo, a causa era um MS. Pegadinha: o recurso extraordinário tem fundamentação VINCULADA (questão constitucional), nunca livre.", "d1": "\"Fundamentação livre\" exclui o RE de cara — sobra um recurso com nome antigo.", "d2": "Recurso ordinário ao STJ = MS denegado em única instância.", "nota": "Você errou esta na Meta 18. Marcou A; gabarito D.", "errei": true}, {"n": 82, "id": "m1000-0082", "meta": 18, "disc": "Constitucional", "tema": "Lei distrital — Súmula 642", "tipo": "FGV · TJ/SC · 2021", "p": "Cabe ADI no STF contra lei distrital sobre parcelamento e ocupação do solo urbano (Súmula 642/STF)?", "r": "NÃO — lei distrital derivada da competência MUNICIPAL do DF (que acumula competências estaduais e municipais, CF, art. 32, §1º) não se ataca por ADI (Súmula 642/STF); o instrumento adequado é a ADPF. Pegadinha: partido com representação só no Senado JÁ é legitimado (basta representação no CN) — o que afasta a ADI é a natureza municipal da lei, não a legitimidade.", "d1": "Pergunte de qual chapéu do DF veio a lei: estadual ou municipal?", "d2": "Competência municipal do DF → sem ADI; via ADPF (Súmula 642).", "nota": "Você errou esta na Meta 18. Marcou E; gabarito B.", "errei": true}, {"n": 83, "id": "m1000-0083", "meta": 18, "disc": "Constitucional", "tema": "Controle preventivo — MS de parlamentar", "tipo": "CESPE · TJ/RR · 2025", "p": "Que instrumento pode sustar a tramitação de PEC inconstitucional e quem pode manejá-lo (CF, art. 60, §4º)?", "r": "MANDADO DE SEGURANÇA IMPETRADO EXCLUSIVAMENTE POR PARLAMENTAR da respectiva Casa — titular do direito líquido e certo ao devido processo legislativo (ex.: PEC tendente a abolir cláusula pétrea, CF, art. 60, §4º). Pegadinha: não cabe ADI contra PEC em tramitação, o MS não é de qualquer cidadão, e ele perde objeto se o projeto é aprovado ou arquivado.", "d1": "O controle preventivo judicial existe, mas o legitimado é um só perfil.", "d2": "MS do parlamentar da Casa — nunca ADI, nunca cidadão comum.", "nota": "", "errei": false}, {"n": 84, "id": "m1000-0084", "meta": 18, "disc": "Constitucional", "tema": "Hermenêutica — texto × norma", "tipo": "FGV · TJ/SC · 2021", "p": "A distinção entre texto normativo e norma fundamenta qual técnica de controle em ADI?", "r": "A DECLARAÇÃO DE INCONSTITUCIONALIDADE PARCIAL SEM REDUÇÃO DE TEXTO — como do mesmo significante se extraem vários significados, afasta-se a interpretação inconstitucional mantendo-se o texto intacto. Pegadinhas: nessa técnica NÃO há nulidade de parte do texto, e a mutação constitucional não é excluída das normas-regra.", "d1": "Se texto e norma não se confundem, dá para matar o sentido sem tocar na letra.", "d2": "Inconstitucionalidade parcial sem redução de texto.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito B.", "errei": true}, {"n": 85, "id": "m1000-0085", "meta": 18, "disc": "Constitucional", "tema": "Controle concentrado — parâmetro", "tipo": "CESPE · TJ/RO · 2025", "p": "A Lei Orgânica Municipal serve de parâmetro para controle concentrado de lei municipal?", "r": "NÃO — o confronto lei municipal × Lei Orgânica é questão de LEGALIDADE, não de constitucionalidade, segundo o STF. Pegadinhas: a causa de pedir aberta não autoriza reabrir o mérito por parâmetros não invocados; o amicus curiae, em regra, não tem legitimidade recursal; e o juiz de 1º grau faz controle incidental sem depender de prévia declaração do tribunal.", "d1": "Nem toda norma superior local é parâmetro constitucional.", "d2": "Lei municipal × LOM = legalidade, não constitucionalidade.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito C.", "errei": true}, {"n": 86, "id": "m1000-0086", "meta": 18, "disc": "Constitucional", "tema": "Reprodução obrigatória — ADI estadual", "tipo": "FGV · TJ/SC · 2021", "p": "O TJ pode julgar representação de inconstitucionalidade de lei municipal por norma de reprodução obrigatória que a Constituição Estadual NÃO reproduziu (CF, art. 125, §2º)?", "r": "SIM — a norma da CF de reprodução obrigatória integra AUTOMATICAMENTE o parâmetro estadual, MESMO SEM repetição expressa na Constituição Estadual (CF, art. 125, §2º; jurisprudência do STF). Pegadinha: exigir que a reprodução \"tenha ocorrido\" é a armadilha; e não há usurpação da competência do STF.", "d1": "Se a reprodução é obrigatória, a omissão do constituinte estadual não muda nada.", "d2": "Vale mesmo sem reprodução expressa na Constituição Estadual.", "nota": "Você errou esta na Meta 18. Marcou E; gabarito D.", "errei": true}, {"n": 87, "id": "m1000-0087", "meta": 18, "disc": "Constitucional", "tema": "Reserva de plenário", "tipo": "FGV · TJ/ES · 2025", "p": "Órgão fracionário que conclui pela CONSTITUCIONALIDADE da lei precisa suscitar o incidente de reserva de plenário (CF, art. 97; SV 10)?", "r": "NÃO — a reserva de plenário só é exigida quando o órgão fracionário AFASTA a norma (declara ou reconhece a inconstitucionalidade); reconhecer a constitucionalidade dispensa o incidente (CF, art. 97; Súmula Vinculante 10). Pegadinha: alternativas que acertam a conclusão pelo motivo errado (competência recursal, procedimento, lei federal) — o fundamento é a conclusão pela constitucionalidade.", "d1": "A cláusula só se ativa num sentido do julgamento — em qual?", "d2": "Só para AFASTAR a norma; validá-la dispensa o plenário.", "nota": "Você errou esta na Meta 18. Marcou A; gabarito E.", "errei": true}, {"n": 88, "id": "m1000-0088", "meta": 18, "disc": "Constitucional", "tema": "ADPF — objeto", "tipo": "FGV · 2025", "p": "Que atos podem ser impugnados por ADPF (Lei 9.882/99)?", "r": "ATOS NORMATIVOS E TAMBÉM ATOS DESTITUÍDOS DE GENERALIDADE E ABSTRAÇÃO (concretos), inclusive municipais e pré-constitucionais — é o instrumento mais amplo do controle concentrado (Lei 9.882/99). Pegadinhas: a ADPF não exige repercussão geral, cabe contra atos pré-constitucionais (juízo de não recepção) e não vincula o Legislativo na função típica de legislar.", "d1": "É a rede mais larga do controle concentrado — pega o que a ADI não pega.", "d2": "Normativos + concretos + municipais + pré-constitucionais.", "nota": "", "errei": false}, {"n": 89, "id": "m1000-0089", "meta": 18, "disc": "Constitucional", "tema": "Controle difuso — reserva de plenário", "tipo": "VUNESP · TJ/SP · 2024", "p": "A interpretação conforme a Constit
