const BLOCOS = [[1,50],[51,100],[101,150],[151,200]];
const LS = 'metas1000v1';
const $ = s => document.querySelector(s);
const byN = Object.fromEntries(DATA.map(c => [c.n, c]));

let store = {resp:{}, pos:{}};
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.resp) store = s; } catch(e){}
const salvar = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch(e){} };

let view = 'home';
let sess = null; // {bloco, ordem:[n...], idx, virada, dicas, embaralhar, filtro}

function statsBloco(b){
  const [i,f] = BLOCOS[b];
  let resp=0, ok=0, err=0, caderno=0;
  for(let n=i;n<=f;n++){
    if(byN[n].errei) caderno++;
    const r = store.resp[n];
    if(r!==undefined && r!==null){ resp++; if(r.g===2) ok++; if(r.g===0) err++; }
  }
  return {total:f-i+1, resp, ok, err, caderno};
}
function resumoGeral(){
  let resp=0, ok=0;
  for(const n in store.resp){ resp++; if(store.resp[n].g===2) ok++; }
  $('#resumoGeral').innerHTML = resp ? `<b>${resp}</b>/200 respondidos · <b>${resp?Math.round(ok/resp*100):0}%</b> de acerto` : '200 cards · 4 blocos de 50';
}

function embaralha(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

function montarOrdem(b, filtro, emb){
  const [i,f] = BLOCOS[b];
  let ns = []; for(let n=i;n<=f;n++) ns.push(n);
  if(filtro==='errados') ns = ns.filter(n => store.resp[n] && store.resp[n].g===0);
  if(filtro==='caderno') ns = ns.filter(n => byN[n].errei);
  if(filtro==='novos') ns = ns.filter(n => !store.resp[n]);
  return emb ? embaralha(ns) : ns;
}

function abrirSessao(b, filtro='todos', emb=false, continuar=true){
  const ordem = montarOrdem(b, filtro, emb);
  if(!ordem.length){ view='sessao-vazia'; sess={bloco:b, filtro}; render(); return; }
  let idx = 0;
  if(continuar && filtro==='todos' && !emb && store.pos[b]!==undefined) idx = Math.min(store.pos[b], ordem.length-1);
  sess = {bloco:b, ordem, idx, virada:false, dicas:0, embaralhar:emb, filtro, feitasNaSessao:0, okNaSessao:0};
  view='sessao'; render();
}

function responder(g){
  if(!sess || !sess.virada) return;
  const n = sess.ordem[sess.idx];
  store.resp[n] = {g, t: Date.now()};
  sess.feitasNaSessao++; if(g===2) sess.okNaSessao++;
  salvar();
  setTimeout(()=> avancar(1, true), 260);
}
function avancar(delta, aposResposta=false){
  if(!sess) return;
  const novo = sess.idx + delta;
  if(novo >= sess.ordem.length){ view='fim'; render(); return; }
  if(novo < 0) return;
  sess.idx = novo; sess.virada=false; sess.dicas=0;
  if(sess.filtro==='todos' && !sess.embaralhar){ store.pos[sess.bloco]=sess.idx; salvar(); }
  render();
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
const FORA = '(?![^<]*>)';
function pintar(t){
  // referências legais em azul
  t = t.replace(new RegExp('(arts?\\.\\s?[0-9][0-9\\.]*(?:-[A-Z])?(?:º)?(?:,?\\s?(?:§+\\s?[0-9º]+|caput|par[áa]grafo [úu]nico|[IVX]+))*)'+FORA,'g'), '<span class="hl-lei">$1</span>');
  t = t.replace(new RegExp('((?:Lei|LC|Decreto|Provimento|Resolu[çc][ãa]o|EC|ADPF|ADIs?|REsp|Tema|S[úu]mula(?:\\s+Vinculante)?)\\s?(?:n[ºo]\\s?)?[0-9][0-9\\.]*(?:\\/[0-9]{2,4})?)'+FORA,'g'), '<span class="hl-lei">$1</span>');
  t = t.replace(new RegExp('\\b(CC\\/16|CC|CPC|CPP|CP|CF|CTN|CDC|LRP|LINDB|LNR|STF|STJ|CNJ)\\b'+FORA,'g'), '<span class="hl-lei">$1</span>');
  // prazos e números em roxo
  t = t.replace(new RegExp('\\b([0-9]+(?:\\/[0-9]+)?\\s?(?:dias?\\s?[úu]teis|dias?|anos?|meses|horas?|%))'+FORA,'g'), '<span class="hl-num">$1</span>');
  // palavras inteiras em MAIÚSCULAS em vermelho (ponto-chave)
  t = t.replace(new RegExp('(\\b[A-ZÁÉÍÓÚÂÊÔÃÕÇÜ]{3}[A-ZÁÉÍÓÚÂÊÔÃÕÇÜ\\-]*(?:\\s+(?:[A-ZÁÉÍÓÚÂÊÔÃÕÇÜ]{2}[A-ZÁÉÍÓÚÂÊÔÃÕÇÜ\\-]*|E|O|A|DE|DO|DA|EM|AO|NO|NA))*)'+FORA,'g'), '<span class="hl-chave">$1</span>');
  return t;
}
function destacar(t){
  const i = t.indexOf('Pegadinha:');
  if(i>=0){
    const pega = t.slice(i).replace('Pegadinha:','<span class="rotulo">Pegadinha:</span>');
    return pintar(t.slice(0,i)) + '<span class="hl-pega">' + pintar(pega) + '</span>';
  }
  return pintar(t);
}
function fraseHtml(r){ return destacar(esc(r)); }

function render(){
  resumoGeral();
  const app = $('#app'); const ctrl = $('#controles');
  if(view==='home'){
    ctrl.classList.add('oculto');
    app.innerHTML = '<div class="grid-blocos">' + BLOCOS.map((bf,b)=>{
      const s = statsBloco(b);
      const pct = Math.round(s.resp/s.total*100);
      return `<section class="bloco">
        <h2>Bloco ${b+1}</h2>
        <div class="faixa">cards ${bf[0]}–${bf[1]}</div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <div class="nums"><span>${s.resp}/${s.total} vistos</span><span class="ok">${s.ok} acertos</span><span class="err">${s.err} errados</span></div>
        <div><span class="chip">${s.caderno} do Caderno de Erros</span></div>
        <div class="acoes">
          <button class="btn primaria" data-est="${b}">${s.resp>0 && s.resp<s.total?'Continuar':'Estudar'}</button>
          <button class="btn" data-lista="${b}">Lista</button>
          ${s.err>0?`<button class="btn mini" data-refazer="${b}">Refazer ${s.err} errados</button>`:''}
          ${s.resp>0?`<button class="btn mini" data-zerar="${b}">Zerar</button>`:''}
        </div>
      </section>`;
    }).join('') + '</div>';
    app.querySelectorAll('[data-est]').forEach(el=>el.onclick=()=>abrirSessao(+el.dataset.est));
    app.querySelectorAll('[data-lista]').forEach(el=>el.onclick=()=>{ sess={bloco:+el.dataset.lista}; view='lista'; render(); });
    app.querySelectorAll('[data-refazer]').forEach(el=>el.onclick=()=>abrirSessao(+el.dataset.refazer,'errados',false,false));
    app.querySelectorAll('[data-zerar]').forEach(el=>el.onclick=()=>{
      const b=+el.dataset.zerar;
      if(!confirm(`Zerar o progresso do Bloco ${b+1}?`)) return;
      const [i,f]=BLOCOS[b]; for(let n=i;n<=f;n++) delete store.resp[n];
      delete store.pos[b]; salvar(); render();
    });
    return;
  }
  if(view==='lista'){
    ctrl.classList.add('oculto');
    const b = sess.bloco; const [i,f]=BLOCOS[b];
    let rows='';
    for(let n=i;n<=f;n++){
      const c=byN[n]; const r=store.resp[n];
      rows+=`<button class="item" data-ir="${n}"><span class="n">${n}</span><span class="dot ${r?('g'+r.g):''}"></span><span class="t">${esc(c.tema||c.p.slice(0,70))}</span>${c.errei?'<span class="chip">ERREI</span>':''}</button>`;
    }
    app.innerHTML = `<button class="voltar" id="vHome">← Blocos</button><h2 style="margin:6px 0 12px">Bloco ${b+1} · cards ${i}–${f}</h2><div class="lista">${rows}</div>`;
    $('#vHome').onclick=()=>{view='home';render();};
    app.querySelectorAll('[data-ir]').forEach(el=>el.onclick=()=>{
      const n=+el.dataset.ir; abrirSessao(b,'todos',false,false); sess.idx = sess.ordem.indexOf(n); render();
    });
    return;
  }
  if(view==='sessao-vazia'){
    ctrl.classList.add('oculto');
    const rot = {errados:'Nenhum card errado neste bloco — bom sinal.', caderno:'Este bloco não tem cards do Caderno de Erros.', novos:'Você já viu todos os cards deste bloco.'};
    app.innerHTML = `<button class="voltar" id="vHome">← Blocos</button><div class="aviso-vazio" style="margin-top:12px">${rot[sess.filtro]||'Nada aqui.'}</div>`;
    $('#vHome').onclick=()=>{view='home';render();};
    return;
  }
  if(view==='fim'){
    ctrl.classList.add('oculto');
    const pct = sess.feitasNaSessao?Math.round(sess.okNaSessao/sess.feitasNaSessao*100):0;
    const s = statsBloco(sess.bloco);
    app.innerHTML = `<div class="fim">
      <h2>Fim da rodada — Bloco ${sess.bloco+1}</h2>
      <div class="placar">
        <div><div class="v">${sess.feitasNaSessao}</div><div class="l">respondidos</div></div>
        <div><div class="v" style="color:var(--good)">${sess.okNaSessao}</div><div class="l">acertos</div></div>
        <div><div class="v">${pct}%</div><div class="l">na rodada</div></div>
      </div>
      <div class="acoes" style="justify-content:center">
        ${s.err>0?`<button class="btn primaria" id="fRefazer">Refazer os ${s.err} errados</button>`:''}
        <button class="btn" id="fHome">Voltar aos blocos</button>
      </div></div>`;
    const fr = $('#fRefazer'); if(fr) fr.onclick=()=>abrirSessao(sess.bloco,'errados',false,false);
    $('#fHome').onclick=()=>{view='home';render();};
    return;
  }
  // sessão
  const n = sess.ordem[sess.idx]; const c = byN[n];
  const filtros = [['todos','Sequência'],['novos','Só novos'],['errados','Só errados'],['caderno','Caderno de Erros']];
  app.innerHTML = `
    <button class="voltar" id="vHome">← Blocos</button>
    <div class="sess-top">
      <div class="modo">${filtros.map(([k,r])=>`<button class="toggle" aria-pressed="${sess.filtro===k}" data-f="${k}">${r}</button>`).join('')}</div>
      <button class="toggle" aria-pressed="${sess.embaralhar}" id="tEmb">Embaralhar</button>
    </div>
    <div class="progress-linha"><span>Bloco ${sess.bloco+1}</span><div class="barra"><i style="width:${Math.round((sess.idx)/sess.ordem.length*100)}%"></i></div><span>${sess.idx+1} de ${sess.ordem.length}</span></div>
    <div class="palco"><div class="carta ${sess.virada?'virada':''}" id="carta">
      <div class="face frente" role="button" tabindex="0" aria-label="Virar o card">
        <div class="meta-linha"><span class="num">Nº ${c.n}</span><span>Meta ${c.meta} · ${esc(c.disc)}</span><span>${esc(c.tema)}</span></div>
        <div class="texto-p">${destacar(esc(c.p))}</div>
        <div class="dicas-area">
          ${sess.dicas>=1&&c.d1?`<div class="dica"><b>Dica 1</b>${destacar(esc(c.d1))}</div>`:''}
          ${sess.dicas>=2&&c.d2?`<div class="dica"><b>Dica 2</b>${destacar(esc(c.d2))}</div>`:''}
        </div>
      </div>
      <div class="face verso" role="button" tabindex="0" aria-label="Voltar para a pergunta">
        <div class="meta-linha"><span class="num">Nº ${c.n}</span><span>${esc(c.tipo||'')}</span>${c.errei?'<span class="chip">ERREI NA META</span>':''}</div>
        <div class="texto-r">${fraseHtml(c.r)}</div>
        ${c.nota?`<div class="nota-errei">${esc(c.nota)}</div>`:''}
      </div>
    </div></div>`;
  $('#vHome').onclick=()=>{view='home';render();};
  app.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>abrirSessao(sess.bloco, el.dataset.f, sess.embaralhar, false));
  $('#tEmb').onclick=()=>abrirSessao(sess.bloco, sess.filtro, !sess.embaralhar, false);
  $('#carta').querySelectorAll('.face').forEach(fc=>{
    fc.onclick=()=>{ sess.virada=!sess.virada; render(); };
    fc.onkeydown=e=>{ if(e.key==='Enter'){ sess.virada=!sess.virada; render(); } };
  });
  // controles
  ctrl.classList.remove('oculto');
  const linha = $('#ctrlLinha');
  if(!sess.virada){
    linha.innerHTML = `
      <button class="btn seta" id="bAnt" ${sess.idx===0?'disabled':''}>←</button>
      <button class="btn" id="bDica" ${sess.dicas>=2||(!c.d1&&!c.d2)?'disabled':''}>Dica ${sess.dicas===0&&c.d1?'1':'2'}</button>
      <button class="btn primaria grau" id="bVirar">Virar — resposta</button>
      <button class="btn seta" id="bProx">→</button>`;
    $('#bVirar').onclick=()=>{sess.virada=true;render();};
    $('#bDica').onclick=()=>{sess.dicas++;render();};
  } else {
    linha.innerHTML = `
      <button class="btn seta" id="bAnt" ${sess.idx===0?'disabled':''}>←</button>
      <button class="btn grau g0" id="g0">Errei</button>
      <button class="btn grau g1" id="g1">Difícil</button>
      <button class="btn grau g2" id="g2">Acertei</button>
      <button class="btn seta" id="bProx">→</button>`;
    $('#g0').onclick=()=>responder(0); $('#g1').onclick=()=>responder(1); $('#g2').onclick=()=>responder(2);
  }
  $('#bAnt').onclick=()=>avancar(-1); $('#bProx').onclick=()=>avancar(1);
}

document.addEventListener('keydown', e=>{
  if(view!=='sessao') return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.code==='Space'){ e.preventDefault(); sess.virada=!sess.virada; render(); }
  else if(e.key==='ArrowRight') avancar(1);
  else if(e.key==='ArrowLeft') avancar(-1);
  else if(e.key==='d'||e.key==='D'){ if(!sess.virada && sess.dicas<2){ sess.dicas++; render(); } }
  else if(e.key==='1') responder(0);
  else if(e.key==='2') responder(1);
  else if(e.key==='3') responder(2);
});
render();
</script>
</body>
</html>
