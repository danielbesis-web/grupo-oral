uição atrai a cláusula de reserva de plenário (CF, art. 97; SV 10)?", "r": "NÃO — na interpretação conforme não há declaração de inconstitucionalidade nem afastamento da norma, logo a reserva de plenário não incide. Pegadinhas: o JUIZ SINGULAR nunca se submete à cláusula (é regra de tribunais) e, no controle difuso, os efeitos são em regra INTER PARTES e ex tunc, não erga omnes.", "d1": "Se a norma sai viva da interpretação, o plenário não precisa ser chamado.", "d2": "Interpretação conforme não atrai o art. 97; juiz singular também não.", "nota": "Você errou esta na Meta 18. Marcou D; gabarito A.", "errei": true}, {"n": 90, "id": "m1000-0090", "meta": 18, "disc": "Constitucional", "tema": "MS — liquidez e certeza", "tipo": "FGV · TJ/SE · 2023", "p": "O que acontece com o MS cujo impetrante precisa de perícia e testemunhas para provar o direito (Lei 12.016/09, art. 1º; Súmula 304/STF)?", "r": "INDEFERE-SE A INICIAL POR FALTA DE LIQUIDEZ E CERTEZA — o MS exige prova pré-constituída, e a necessidade de dilação probatória afasta o direito líquido e certo; mas o autor PODE renovar a pretensão pela via comum, pois a denegação sem mérito não faz coisa julgada (Súmula 304/STF). Pegadinha: o distrator do prazo de 120 dias é a armadilha — o vício decisivo é a dilação probatória, não a decadência.", "d1": "Conte o que o impetrante quis produzir dentro do MS — aí está o vício.", "d2": "Precisou de perícia/testemunha → falta liquidez; indefere podendo renovar.", "nota": "", "errei": false}, {"n": 91, "id": "m1000-0091", "meta": 19, "disc": "Notarial/Registral", "tema": "Independência do delegatário", "tipo": "CESPE · TJ/RR · 2025", "p": "O que abrange a independência do notário e registrador (Lei 8.935/94, arts. 28-29)?", "r": "TUDO: SUJEIÇÃO APENAS À LEI, base da autonomia e da prevenção de responsabilidades, ABRANGENDO A GESTÃO DA SERVENTIA (empregados, tecnologia) quando não houver diretrizes compulsórias — SEM dispensar o dever de motivar as decisões (Lei 8.935/94, arts. 28-29). Pegadinha: tentar excluir o dever de motivar ou a gestão administrativa do alcance da independência — todos os itens eram certos.", "d1": "A independência é ampla, mas vem com um dever que não some.", "d2": "Só à lei + gestão da serventia + dever de motivar (todos certos).", "nota": "Você errou esta na Meta 19. Marcou A; gabarito E.", "errei": true}, {"n": 92, "id": "m1000-0092", "meta": 19, "disc": "Notarial/Registral", "tema": "Natureza do cartório", "tipo": "CESPE · TJ/RO · 2025", "p": "Na substituição do titular do cartório, a responsabilidade do antecessor passa ao sucessor (STJ)?", "r": "NÃO — a responsabilidade do delegatário é PESSOAL E INTRANSMISSÍVEL: o novo titular não responde pelos danos causados pela atuação do antecessor (STJ; CF, art. 236; Lei 8.935/94). Pegadinha: o cartório NÃO tem personalidade jurídica, não é empresa e não tem patrimônio próprio — quem responde é o titular (ou o Estado).", "d1": "A serventia não é pessoa — pense em quem carrega a responsabilidade.", "d2": "Responsabilidade pessoal do titular; não se transmite ao sucessor.", "nota": "", "errei": false}, {"n": 93, "id": "m1000-0093", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade do Estado — Tema 777", "tipo": "FGV · TJ/SE · 2023", "p": "Como responde o Estado pelos danos causados por notários e registradores (STF, Tema 777)?", "r": "OBJETIVAMENTE — o Estado responde de forma objetiva pelos atos dos delegatários no exercício da função, assegurado o REGRESSO contra o responsável nos casos de DOLO OU CULPA (CF, art. 37, §6º; STF, Tema 777). Pegadinha: não é responsabilidade subsidiária, o regresso não é suprimido e a responsabilidade do delegatário permanece subjetiva.", "d1": "O particular lesado aciona o ente maior; o acerto de contas vem depois.", "d2": "Estado objetivo + regresso contra o delegatário (dolo/culpa).", "nota": "", "errei": false}, {"n": 94, "id": "m1000-0094", "meta": 19, "disc": "Notarial/Registral", "tema": "Direitos do registrador", "tipo": "IESES · TJ/AM · 2023", "p": "Quais são DIREITOS do registrador na Lei 8.935/94 (art. 28)?", "r": "EXERCER OPÇÃO NOS CASOS DE DESMEMBRAMENTO OU DESDOBRAMENTO DA SERVENTIA e ORGANIZAR ASSOCIAÇÕES OU SINDICATOS DE CLASSE e deles participar (art. 28, Lei 8.935/94). Pegadinhas: os emolumentos são INTEGRAIS (não 50%); as requisições prioritárias são para defesa de PJ de direito público em juízo (não \"qualquer finalidade\"); e a fiscalização tributária não se restringe a tributos municipais.", "d1": "Dois direitos clássicos: um sobre o destino da serventia, outro associativo.", "d2": "Opção no desmembramento + associar-se/sindicalizar-se.", "nota": "", "errei": false}, {"n": 95, "id": "m1000-0095", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade civil — art. 22", "tipo": "IESES · TJ/PA · 2026", "p": "Por qual elemento subjetivo respondem civilmente notários e registradores (Lei 8.935/94, art. 22)?", "r": "POR CULPA OU DOLO — respondem pessoalmente por todos os prejuízos que causarem a terceiros, inclusive pelos substitutos que designarem e escreventes que autorizarem, assegurado o direito de regresso (art. 22, Lei 8.935/94). Pegadinhas: as incompletas trazem \"só dolo\" ou \"só culpa\"; a responsabilidade civil NÃO depende de condenação criminal (instâncias independentes).", "d1": "A alternativa completa junta os dois elementos subjetivos.", "d2": "Culpa OU dolo, pessoalmente, com regresso.", "nota": "", "errei": false}, {"n": 96, "id": "m1000-0096", "meta": 19, "disc": "Notarial/Registral", "tema": "Procedimento de dúvida", "tipo": "CONSULPLAN · TJ/AC · 2023", "p": "Quem resolve a dúvida suscitada pelo tabelião de protesto (LRP, arts. 198-204; Lei 9.492/97)?", "r": "O JUÍZO COMPETENTE — o procedimento de dúvida tem natureza administrativa e é decidido pelo juiz da serventia (LRP, arts. 198-204; Lei 9.492/97). Pegadinha: não é desembargador isolado, nem a Corregedoria do Tribunal, nem o CNJ em 72 horas.", "d1": "A resposta é a mais singela — a autoridade de sempre do procedimento de dúvida.", "d2": "O juízo competente (natureza administrativa).", "nota": "", "errei": false}, {"n": 97, "id": "m1000-0097", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade civil — prescrição", "tipo": "IESES · TJ/TO · 2022", "p": "A pretensão de reparação civil contra notários e registradores é imprescritível (Lei 8.935/94, art. 22; CC, art. 206, §3º, V)?", "r": "NÃO — HÁ PRESCRIÇÃO: a pretensão de reparação prescreve em 3 ANOS (CC, art. 206, §3º, V; STJ), e o termo inicial não é a data de lavratura do ato. As instâncias civil e criminal são independentes, e a individualização criminal não exime a responsabilidade civil. Pegadinha: \"não há prescrição\" é o erro central — a banca ainda classificou como falsa a assertiva sobre a responsabilidade pelos substitutos.", "d1": "Reparação civil não é eterna — há prazo, e curto.", "d2": "Prescreve em 3 anos (trienal, STJ).", "nota": "Você errou esta na Meta 19. Marcou A; gabarito B.", "errei": true}, {"n": 98, "id": "m1000-0098", "meta": 19, "disc": "Notarial/Registral", "tema": "Deveres × direitos", "tipo": "IESES · TJ/TO · 2022", "p": "Organizar associações ou sindicatos de classe é DEVER ou DIREITO do notário/registrador (Lei 8.935/94, arts. 28 e 30)?", "r": "É DIREITO (art. 28), NÃO DEVER — são deveres, entre outros, fiscalizar o recolhimento dos impostos dos atos, atender prioritariamente as requisições para defesa de PJ de direito público em juízo e dignificar a função na vida profissional e privada (art. 30, Lei 8.935/94). Pegadinha: a troca direito↔dever do item da associação é o clássico da banca.", "d1": "Um dos quatro itens está na lista errada da lei.", "d2": "Associar-se = direito (art. 28); os demais = deveres (art. 30).", "nota": "Você errou esta na Meta 19. Marcou C; gabarito D.", "errei": true}, {"n": 99, "id": "m1000-0099", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade do Estado — Tema 777", "tipo": "FGV · TJ/SC · 2021", "p": "Quem responde pela indenização quando o oficial do registro civil erra dolosamente o assento e causa dano (STF, Tema 777)?", "r": "O ESTADO, DE FORMA DIRETA E OBJETIVA, com dever de REGRESSO contra o oficial se comprovado dolo ou culpa (CF, art. 37, §6º; STF, Tema 777). Pegadinha: não é responsabilidade subsidiária/subjetiva do Estado, não há solidariedade com o cartório nem responsabilidade objetiva direta do delegatário.", "d1": "Mesmo com desafeto e má-fé do oficial, quem figura no polo passivo é outro.", "d2": "Estado direto e objetivo; regresso contra o oficial.", "nota": "", "errei": false}, {"n": 100, "id": "m1000-0100", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade do Estado — Tema 777", "tipo": "FGV · Enac · 2025", "p": "Notário negligente causa dano ao lavrar escritura: quem responde e como (STF, Tema 777)?", "r": "O ESTADO RESPONDE OBJETIVAMENTE, admitido o REGRESSO contra o notário que agiu com CULPA (CF, art. 37, §6º; STF, Tema 777) — a responsabilidade do delegatário é subjetiva. Pegadinha: não há responsabilidade subjetiva do Estado, nem solidariedade, nem responsabilidade objetiva do notário.", "d1": "O desenho é sempre o mesmo: um responde sem culpa, o outro só com ela.", "d2": "Estado objetivo + regresso contra o notário culpado.", "nota": "", "errei": false}, {"n": 101, "id": "m1000-0101", "meta": 19, "disc": "Notarial/Registral", "tema": "Gratuidade e infração disciplinar", "tipo": "IESES · TJ/PA · 2026", "p": "O registrador pode cobrar emolumentos pelo registro de nascimento e pela 1ª certidão em caso de urgência (Lei 9.534/97; Lei 8.935/94, arts. 31-33)?", "r": "NÃO — o registro de nascimento e a primeira certidão são GRATUITOS, independentemente de urgência: cobrar é cobrança indevida e infração disciplinar, sujeita a repreensão, multa, suspensão ou perda da delegação, observada a gradação (Lei 9.534/97; arts. 31 a 33 da Lei 8.935/94). Pegadinha: não existe pena de \"censura\" e as penas não independem de gradação.", "d1": "A urgência não muda a natureza do ato de registro de nascimento.", "d2": "Nascimento e 1ª certidão são gratuitos; cobrar = infração com penas graduadas.", "nota": "", "errei": false}, {"n": 102, "id": "m1000-0102", "meta": 19, "disc": "Notarial/Registral", "tema": "Incompatibilidades e impedimentos", "tipo": "FGV · Enac · 2025", "p": "Pela Lei 8.935/94, o notário diplomado em cargo eletivo deve se afastar? Ele pode advogar? E pode praticar ato de interesse de primo, parente colateral de 4º grau (arts. 25 a 27)?", "r": "AFASTA, NÃO ADVOGA, E O ATO DO PRIMO PODE — a diplomação em cargo eletivo afasta o notário; a atividade notarial é incompatível com a advocacia; e o impedimento do art. 27 só alcança parentes até o 3º grau, de modo que o ato de interesse do primo (colateral de 4º grau) PODE ser praticado. Pegadinha clássica: primo está fora do impedimento.", "d1": "Conte os graus do parentesco do primo antes de responder.", "d2": "Impedimento vai só até o 3º grau; primo é 4º.", "nota": "", "errei": false}, {"n": 103, "id": "m1000-0103", "meta": 19, "disc": "Notarial/Registral", "tema": "Responsabilidade do Estado", "tipo": "CESPE · TJ/PE · 2024", "p": "Como o Estado responde pelos danos causados por notários e registradores (CF, art. 37, §6º; STF Tema 777)?", "r": "OBJETIVAMENTE, COM REGRESSO — o Estado responde objetivamente pelos danos causados por tabeliães e registradores no exercício da função, assegurado o dever de regresso contra o responsável nos casos de dolo ou culpa (STF Tema 777, RE 842.846). Pegadinha: não é responsabilidade subjetiva do Estado nem se suprime o regresso.", "d1": "Tese fixada em repercussão geral sobre atos de delegatários.", "d2": "Estado objetivo + regresso por dolo ou culpa (Tema 777).", "nota": "", "errei": false}, {"n": 104, "id": "m1000-0104", "meta": 19, "disc": "Notarial/Registral", "tema": "Incompatibilidades", "tipo": "IESES · TJ/TO · 2022", "p": "A incompatibilidade da atividade notarial/registral com cargo ou função pública admite exceção para cargo em comissão (Lei 8.935/94, art. 25)?", "r": "NÃO — a incompatibilidade alcança qualquer cargo, emprego ou função pública AINDA QUE em comissão (art. 25 da Lei 8.935/94); também é incompatível com a advocacia e com a intermediação dos serviços. Pegadinha: a ressalva \"exceto em comissão\" é erro plantado — a exceção real é o magistério.", "d1": "Atenção à ressalva sobre cargo em comissão — ela existe mesmo?", "d2": "Mesmo em comissão é incompatível; só o magistério escapa.", "nota": "Você errou esta na Meta 19. Marcou D; gabarito C.", "errei": true}, {"n": 105, "id": "m1000-0105", "meta": 20, "disc": "Civil", "tema": "Usucapião — bens de empresa pública", "tipo": "FGV · TJ-SE · 2023", "p": "Imóvel em condomínio pro indiviso com empresa pública pode ser usucapido, e é preciso ajuizar demarcatória prévia (CC, arts. 98 e 102)?", "r": "PODE, SEM DEMARCATÓRIA PRÉVIA — os bens de empresa pública não são, em regra, bens públicos (o art. 98 do CC só qualifica como públicos os das pessoas jurídicas de direito público interno), então a usucapião é viável e não depende do prévio ajuizamento de ação demarcatória para destacar a fração da empresa pública. Pegadinha: não existe imprescritibilidade absoluta dos bens de empresa pública — em regra, eles são usucapíveis.", "d1": "Empresa pública é pessoa jurídica de direito privado — isso muda tudo.", "d2": "Bem de empresa pública não afetado é usucapível, sem demarcatória prévia.", "nota": "Você errou esta na Meta 20. Marcou E; gabarito C.", "errei": true}, {"n": 106, "id": "m1000-0106", "meta": 20, "disc": "Civil", "tema": "Condomínio edilício — convenção", "tipo": "FGV · TJ-SC · 2021", "p": "Quantas frações ideais devem subscrever a convenção de condomínio para obrigar condôminos e ocupantes, e o registro é exigido (CC, art. 1.333)?", "r": "2/3 DAS FRAÇÕES IDEAIS, SEM REGISTRO — a convenção subscrita por, no mínimo, 2/3 das frações torna-se desde logo obrigatória para titulares e ocupantes (inclusive o usufrutuário), independentemente de registro (art. 1.333 do CC). Pegadinha: o registro no RI (par. único) serve só para eficácia contra terceiros, não para obrigar quem está dentro do condomínio.", "d1": "Separe validade interna da convenção e eficácia contra terceiros.", "d2": "2/3 das frações; registro só para valer contra terceiros.", "nota": "Você errou esta na Meta 20. Marcou E; gabarito B.", "errei": true}, {"n": 107, "id": "m1000-0107", "meta": 20, "disc": "Civil", "tema": "Acessões naturais", "tipo": "CONSULPLAN · TJ-MA · 2023", "p": "Ilhas, aluvião, avulsão e álveo abandonado: quem adquire e quando há indenização (CC, arts. 1.249 a 1.252)?", "r": "OS RIBEIRINHOS ADQUIREM, E SÓ A AVULSÃO PODE GERAR INDENIZAÇÃO — as ilhas formadas em correntes comuns ou particulares vão aos ribeirinhos fronteiros na proporção das testadas (art. 1.249); o aluvião pertence aos donos dos terrenos marginais SEM indenização (art. 1.250); na avulsão, o dono do prédio acrescido adquire se indenizar o dono do primeiro ou se ninguém reclamar em 1 ANO (art. 1.251); e o álveo abandonado vai aos ribeirinhos das duas margens, sem indenização aos donos dos terrenos por onde as águas abrirem novo curso (art. 1.252). Pegadinha: só a avulsão envolve indenização — ou o prazo de 1 ano.", "d1": "Siga as margens: quem é vizinho do rio costuma ficar com o acréscimo.", "d2": "Arts. 1.249 a 1.252 — e só a avulsão indeniza (ou espera 1 ano).", "nota": "Você errou esta na Meta 20. Marcou D; gabarito A.", "errei": true}, {"n": 108, "id": "m1000-0108", "meta": 20, "disc": "Civil", "tema": "Propriedade resolúvel", "tipo": "IESES · TJ-PA · 2026", "p": "Quais os efeitos da resolução da propriedade por condição/termo e por causa superveniente (CC, arts. 1.359 e 1.360)?", "r": "EX TUNC + ERGA OMNES × EX NUNC + INTER PARTES — a resolução por implemento da condição ou advento do termo (art. 1.359) retroage e vale contra todos, resolvendo os direitos reais concedidos na pendência; a resolução por causa superveniente (art. 1.360) opera só dali em diante e entre as partes. Pegadinha: o par de efeitos é exatamente o divisor entre os dois artigos.", "d1": "O momento da causa da resolução (originária ou superveniente) define os efeitos.", "d2": "Condição/termo = ex tunc e erga omnes; causa superveniente = ex nunc e inter partes.", "nota": "", "errei": false}, {"n": 109, "id": "m1000-0109", "meta": 20, "disc": "Civil", "tema": "Usucapião — modalidades", "tipo": "CEBRASPE · TJ-RR · 2025", "p": "A usucapião extraordinária exige justo título e boa-fé (CC, art. 1.238)?", "r": "NÃO — na extraordinária basta posse contínua e incontestada com ânimo de dono pelo prazo legal, independentemente de justo título e boa-fé; o prazo se reduz se o possuidor estabeleceu moradia habitual ou realizou obras produtivas (art. 1.238, par. único). Admite-se a soma de posses (art. 1.243) e, para o STJ, a sentença é DECLARATÓRIA e retroage ao implemento dos requisitos. Pegadinha: justo título e boa-fé são da ordinária (art. 1.242).", "d1": "Qual modalidade dispensa título e boa-fé e ainda tem prazo reduzido por moradia?", "d2": "Extraordinária: posse + tempo, sem título nem boa-fé (art. 1.238).", "nota": "", "errei": false}, {"n": 110, "id": "m1000-0110", "meta": 20, "disc": "Civil", "tema": "Propriedade fiduciária", "tipo": "CONSULPLAN · TJ-MS · 2021", "p": "Quando começa a obrigação do credor fiduciário de pagar tributos, taxas e condomínio do bem (CC, art. 1.368-B, par. único)?", "r": "A PARTIR DA IMISSÃO NA POSSE DIRETA — o credor fiduciário que adquire a propriedade (consolidação, adjudicação, dação etc.) só responde pelos encargos do bem desde a data em que for imitido na posse direta (art. 1.368-B, par. único, do CC). Pegadinha: antes da imissão, quem tem só a propriedade resolúvel em garantia não paga esses encargos.", "d1": "O marco não é o contrato nem a consolidação — é um ato possessório.", "d2": "Imissão na posse direta do bem.", "nota": "Você errou esta na Meta 20. Marcou D; gabarito A.", "errei": true}, {"n": 111, "id": "m1000-0111", "meta": 20, "disc": "Civil", "tema": "Servidões — usucapião", "tipo": "FGV · ENAC · 2025", "p": "Servidões aparentes podem ser objeto de hipoteca, de servidão sobre si ou de usucapião (CC, art. 1.379; Súmula 415/STF)?", "r": "SÓ DE USUCAPIÃO — apenas as servidões APARENTES podem ser adquiridas por usucapião (art. 1.379 do CC; Súmula 415 do STF); servidão não é objeto de hipoteca nem de \"servidão sobre servidão\". Pegadinha: a não aparente não se adquire por usucapião nem tem proteção possessória (art. 1.213).", "d1": "Dos três institutos listados, só um se aplica à servidão aparente.", "d2": "Servidão aparente = usucapível; hipoteca não.", "nota": "Você errou esta na Meta 20. Marcou D; gabarito B.", "errei": true}, {"n": 112, "id": "m1000-0112", "meta": 20, "disc": "Civil", "tema": "Vizinhança — passagem forçada", "tipo": "CEBRASPE · TJ-PE · 2024", "p": "Quem pode pedir passagem forçada e há indenização, segundo o STJ (CC, art. 1.285)?", "r": "PROPRIETÁRIO E POSSUIDOR, MEDIANTE INDENIZAÇÃO — para o STJ, a passagem forçada do imóvel encravado pode ser pleiteada tanto pelo proprietário quanto pelo possuidor, sempre pagando indenização ao vizinho onerado (art. 1.285 do CC). Pegadinha: não confundir com a passagem de cabos e tubulações (art. 1.286); a indenização é da essência do instituto.", "d1": "A legitimidade é mais ampla que só o dono, mas o instituto não é de graça.", "d2": "Proprietário ou possuidor + indenização obrigatória.", "nota": "Você errou esta na Meta 20. Marcou B; gabarito D.", "errei": true}, {"n": 113, "id": "m1000-0113", "meta": 20, "disc": "Civil", "tema": "Usucapião — bens insuscetíveis", "tipo": "FGV · TJ-ES · 2025", "p": "Falência, penhora e vacância da herança impedem a usucapião do imóvel (CC, art. 102)?", "r": "FALÊNCIA E VACÂNCIA NÃO IMPEDEM — a usucapião é aquisição ORIGINÁRIA: o bem da massa falida continua privado e a herança jacente/vacante, antes da transferência definitiva ao ente público, ainda é usucapível — a usucapião consumada antes da incorporação prevalece (STJ). Já a hipótese do imóvel penhorado ficou fora do gabarito da banca, embora a penhora, por si, apenas grave o bem. Pegadinha: só o bem já incorporado como público não se usucape (art. 102 do CC).", "d1": "Pergunte-se: em qual momento o bem vira efetivamente público?", "d2": "Antes da incorporação pela vacância, o bem ainda se usucape — falência também não trava.", "nota": "", "errei": false}, {"n": 114, "id": "m1000-0114", "meta": 20, "disc": "Civil", "tema": "Vizinhança — construções", "tipo": "IESES · TJ-AM · 2023", "p": "Na zona rural, qual a distância mínima do terreno vizinho para levantar edificações (CC, art. 1.303)?", "r": "3 METROS — o art. 1.303 do CC veda, na zona rural, edificações a menos de três metros do terreno vizinho. Pegadinha: não confundir com a janela/abertura a menos de metro e meio do prédio vizinho (art. 1.301).", "d1": "É um número pequeno e ímpar — e não é o do art. 1.301.", "d2": "Três metros (zona rural).", "nota": "Você errou esta na Meta 20. Marcou C; gabarito D.", "errei": true}, {"n": 115, "id": "m1000-0115", "meta": 20, "disc": "Civil", "tema": "Condomínio edilício — área comum", "tipo": "CEBRASPE · TJ-RO · 2025", "p": "Condômino autorizado a usar área comum com exclusividade pode usucapi-la ou reformá-la livremente (STJ; CC, art. 1.331, §2º)?", "r": "NÃO USUCAPE E NÃO REFORMA SEM ASSEMBLEIA — para o STJ, área comum de condomínio edilício é insuscetível de usucapião por condômino; a autorização assemblear só gera o dever de respeitar seus limites: o condomínio não retoma sem fato novo e o condômino não reforma sem nova deliberação. Pegadinha: uso exclusivo autorizado não vira propriedade.", "d1": "A permissão da assembleia transfere domínio?", "d2": "Área comum não se usucape; reformas exigem nova deliberação.", "nota": "Você errou esta na Meta 20. Marcou D; gabarito B.", "errei": true}, {"n": 116, "id": "m1000-0116", "meta": 20, "disc": "Civil", "tema": "Servidões — vista/panorama", "tipo": "CONSULPLAN · TJ-MA · 2023", "p": "O desfrute prolongado de bela vista gera servidão de panorama usucapível (CC, arts. 1.378 e 1.379)?", "r": "NÃO — não existe, em regra, servidão de vista/panorama pelo simples desfrute prolongado: trata-se de mera FACULDADE, sem posse de servidão a ser tutelada, e o vizinho pode construir mais alto. Servidões constituem-se por declaração + registro ou usucapião de servidão aparente (arts. 1.378 e 1.379 do CC). Pegadinha: a ação confessória pressupõe servidão existente; a negatória é do dono que nega servidão alheia.", "d1": "Olhar a paisagem é exercício de posse de servidão?", "d2": "Mera faculdade — sem servidão, sem tutela.", "nota": "Você errou esta na Meta 20. Marcou C; gabarito B.", "errei": true}, {"n": 117, "id": "m1000-0117", "meta": 20, "disc": "Civil", "tema": "Servidões — disposições gerais", "tipo": "CONSULPLAN · TJ-MS · 2021", "p": "O dono do prédio dominante pode ampliar unilateralmente a finalidade da servidão (CC, art. 1.385, §1º)?", "r": "NÃO — constituída para certo fim, a servidão não pode ampliar-se a outro pela só vontade do dominante (art. 1.385, §1º). Valem as demais regras: na servidão de trânsito a de maior inclui a de menor ônus (§2º), o serviente não pode embaraçar o exercício (art. 1.383) e as despesas se rateiam quando alcança mais de um prédio (art. 1.384). Pegadinha: a única em desacordo com a lei é a ampliação unilateral.", "d1": "A finalidade da servidão foi ajustada entre os dois prédios — um deles pode mudá-la sozinho?", "d2": "Ampliar finalidade só com novo ajuste — nunca por vontade unilateral.", "nota": "", "errei": false}, {"n": 118, "id": "m1000-0118", "meta": 20, "disc": "Civil", "tema": "Multipropriedade — instituição", "tipo": "FGV · ENAC · 2025", "p": "Como se constitui validamente a multipropriedade (CC, arts. 1.358-C, 1.358-F e 1.358-G)?", "r": "ATO DE INSTITUIÇÃO REGISTRADO NO RI, COM FRAÇÕES DE TEMPO INDIVIDUALIZADAS — a multipropriedade é direito REAL, instituída por ato que preveja expressamente o regime, registrado no cartório de registro de imóveis, individualizando as frações de tempo (Lei 13.777/2018). Pegadinha: não é direito pessoal, não dispensa registro e o art. 1.358-L, §1º, AFASTA o direito de preferência na alienação da fração.", "d1": "Direito real sobre imóvel nasce onde?", "d2": "Registro no RI + individualização das frações; sem preferência.", "nota": "", "errei": false}, {"n": 119, "id": "m1000-0119", "meta": 20, "disc": "Civil", "tema": "Condomínio edilício — vaga de garagem", "tipo": "CEBRASPE · TJ-PE · 2024", "p": "Vaga de garagem com matrícula própria pode ser vendida a estranho ao condomínio (CC, art. 1.331, §1º)?", "r": "SÓ COM AUTORIZAÇÃO EXPRESSA NA CONVENÇÃO — a vaga com matrícula própria é propriedade exclusiva do condômino, mas não pode ser alienada ou alugada a pessoa estranha ao condomínio, salvo autorização expressa na convenção (art. 1.331, §1º, com a Lei 12.607/2012). Pegadinha: nem a hasta pública dispensa a autorização; e a vaga NÃO é propriedade comum.", "d1": "A vaga é exclusiva, mas a saída dela do condomínio tem trava.", "d2": "Alienação a estranho depende da convenção autorizar.", "nota": "Você errou esta na Meta 20. Marcou D; gabarito A.", "errei": true}, {"n": 120, "id": "m1000-0120", "meta": 20, "disc": "Civil", "tema": "Registro — cancelamento e terceiro", "tipo": "CEBRASPE · TJ-PE · 2024", "p": "Cancelado o registro por título anulado/inexistente, o terceiro adquirente de boa-fé mantém seu registro (CC, art. 1.247)?", "r": "NÃO — o cancelamento opera INDEPENDENTEMENTE DA BOA-FÉ OU DO TÍTULO do terceiro: anulado o registro anterior, os subsequentes que dele dependam ficam sem efeito, podendo o titular reivindicar o imóvel, pois ninguém transfere mais direito do que tem (arts. 1.247 e 1.359 do CC). Pegadinha: a proteção do registro é relativa quando a cadeia se assenta em título nulo ou inexistente.", "d1": "A força do registro sobrevive quando o elo anterior da cadeia cai?", "d2": "Independe de boa-fé — a cadeia viciada não se sustenta.", "nota": "", "errei": false}, {"n": 121, "id": "m1000-0121", "meta": 20, "disc": "Civil", "tema": "Direito de habitação", "tipo": "IESES · TJ-PA · 2026", "p": "No direito de habitação conferido a mais de uma pessoa, quem habita sozinho paga aluguel aos demais? Pode-se alugar ou emprestar o bem (CC, arts. 1.414 e 1.415)?", "r": "NÃO PAGA, NÃO ALUGA, NÃO EMPRESTA — se a habitação couber a várias pessoas, quem habita sozinho não deve aluguel aos demais, mas não pode impedir que os outros também exerçam o direito (art. 1.415); e o titular não pode alugar NEM emprestar o imóvel (art. 1.414). Pegadinha: o \"podendo emprestar gratuitamente\" e o \"direito de cobrar aluguel\" são os erros plantados.", "d1": "Habitação é o mais restrito dos direitos reais de fruição.", "d2": "Quem habita sozinho nada paga; alugar e emprestar são sempre vedados.", "nota": "", "errei": false}, {"n": 122, "id": "m1000-0122", "meta": 20, "disc": "Civil", "tema": "Multipropriedade × condomínio", "tipo": "FGV · TJ-SE · 2023", "p": "Qual o traço COMUM entre multipropriedade e condomínio em geral cobrado pela banca (CC, arts. 1.358-C a 1.358-U)?", "r": "A ADJUDICAÇÃO DA FRAÇÃO DO INADIMPLENTE — o condomínio edilício pode adjudicar a fração atribuída ao condômino/multiproprietário inadimplente, mecanismo comum aos dois regimes (art. 1.358-S). Pegadinha: as demais são DIFERENÇAS — a multipropriedade não se sujeita à ação de extinção/divisão (art. 1.358-D), não se extingue pela concentração das frações numa só pessoa e não assegura preferência na alienação (art. 1.358-L, §1º).", "d1": "Procure o mecanismo contra o devedor de cotas que funciona nos dois regimes.", "d2": "Adjudicação da fração do inadimplente.", "nota": "Você errou esta na Meta 20. Marcou C; gabarito D.", "errei": true}, {"n": 123, "id": "m1000-0123", "meta": 20, "disc": "Civil", "tema": "Habitação do cônjuge supérstite", "tipo": "CEBRASPE · TJ-PE · 2024", "p": "Qual a natureza do direito real de habitação do cônjuge supérstite, segundo o STJ (CC, art. 1.831)?", "r": "DIREITO REAL, VITALÍCIO E PERSONALÍSSIMO — vale qualquer que seja o regime de bens (inclusive separação obrigatória) e, para o STJ, não se extingue por novo casamento ou união estável. Pegadinha: só é assegurado sobre o ÚNICO imóvel residencial a inventariar — se o falecido deixou outro da mesma natureza, não há o direito.", "d1": "Três adjetivos definem o instituto — e nenhuma condição de regime ou recasamento o derruba.", "d2": "Real, vitalício e personalíssimo (art. 1.831).", "nota": "Você errou esta na Meta 20. Marcou D; gabarito E.", "errei": true}, {"n": 124, "id": "m1000-0124", "meta": 20, "disc": "Civil", "tema": "Condomínio edilício — obras urgentes", "tipo": "CONSULPLAN · TJ-MA · 2023", "p": "Obras urgentes no condomínio com síndico inerte: o condômino precisa de autorização (CC, art. 1.341)?", "r": "NÃO, SE NÃO HOUVER DESPESA EXCESSIVA — sendo as obras necessárias e URGENTES e não importando despesas excessivas, qualquer condômino pode realizá-las independentemente de autorização do síndico ou da assembleia, com direito a reembolso (art. 1.341, §§1º a 3º). Pegadinha: urgente + despesa excessiva = fazer dando ciência à assembleia; não urgente = depende de autorização.", "d1": "Cruze dois filtros: urgência e vulto da despesa.", "d2": "Urgente e sem despesa excessiva = qualquer condômino faz, sem autorização.", "nota": "Você errou esta na Meta 20. Marcou D; gabarito B.", "errei": true}, {"n": 125, "id": "m1000-0125", "meta": 20, "disc": "Civil", "tema": "Construção em terreno alheio", "tipo": "VUNESP · TJ-SP · 2024", "p": "Construção que invade até 1/20 do solo alheio, com boa-fé: qual a solução legal (CC, art. 1.258)?", "r": "O CONSTRUTOR ADQUIRE O SOLO INVADIDO, INDENIZANDO — havendo boa-fé e invasão não superior à vigésima parte, ele adquire a propriedade da parte invadida se o valor da construção exceder o dessa parte, pagando indenização pela área perdida e pela desvalorização do remanescente (art. 1.258). Pegadinha: a solução muda com a proporção (mais de 1/20) e com a má-fé — nesta, a indenização é agravada em décuplo (art. 1.259).", "d1": "Nem sempre a invasão termina em demolição — depende de fração e boa-fé.", "d2": "Até 1/20 + boa-fé + obra mais valiosa = aquisição com indenização.", "nota": "", "errei": false}, {"n": 126, "id": "m1000-0126", "meta": 20, "disc": "Civil", "tema": "Usufruto — caráter personalíssimo", "tipo": "FGV · TJ-SC · 2021", "p": "O usufruto pode ser transmitido aos herdeiros do usufrutuário (CC, arts. 1.393 e 1.410, I)?", "r": "NÃO — o usufruto é PERSONALÍSSIMO e extingue-se com a morte do usufrutuário (art. 1.410, I); é inválida a cláusula de transmissão aos herdeiros. Pegadinha: o EXERCÍCIO pode ser cedido, inclusive onerosamente (art. 1.393), o prazo determinado é válido e a caução pode ser dispensada (art. 1.400, par. único).", "d1": "Distinga o direito em si do seu exercício.", "d2": "Morte extingue o usufruto; herdeiro não herda usufruto.", "nota": "Você errou esta na Meta 20. Marcou B; gabarito A.", "errei": true}, {"n": 127, "id": "m1000-0127", "meta": 20, "disc": "Civil", "tema": "Usufruto — direitos e deveres", "tipo": "CONSULPLAN · TJ-MS · 2021", "p": "Usufruto sobre títulos de crédito: o usufrutuário pode cobrar as dívidas respectivas (CC, art. 1.395)?", "r": "PODE — recaindo o usufruto em títulos de crédito, o usufrutuário tem direito a perceber os frutos E a cobrar as respectivas dívidas (art. 1.395); é falsa a assertiva que veda a cobrança. Regras vizinhas corretas: não paga deteriorações do uso regular (art. 1.402), responde pelos juros da dívida que onera o patrimônio (art. 1.405) e faz seus os frutos naturais pendentes ao início, sem pagar despesas de produção (art. 1.396).", "d1": "A lei dá ao usufrutuário de títulos de crédito mais do que só perceber os frutos.", "d2": "Títulos de crédito: perceber frutos + cobrar as dívidas.", "nota": "Você errou esta na Meta 20. Marcou A; gabarito C.", "errei": true}, {"n": 128, "id": "m1000-0128", "meta": 20, "disc": "Civil", "tema": "Usucapião familiar", "tipo": "IESES · TJ · 2023", "p": "Qual modalidade de usucapião exige apenas 2 anos de posse direta e exclusiva sobre imóvel urbano de até 250 m² dividido com ex-cônjuge ou ex-companheiro que abandonou o lar?", "r": "USUCAPIÃO ESPECIAL URBANA FAMILIAR (POR ABANDONO DO LAR) — posse direta e exclusiva por 2 anos, imóvel urbano de até 250 m² dividido com ex-cônjuge/ex-companheiro que abandonou o lar, uso para moradia e não ser dono de outro imóvel (art. 1.240-A). É a modalidade de MENOR prazo. Pegadinha: exige-se abandono do lar afetivo e material, sem reaproximação, e só se aplica uma vez.", "d1": "É a usucapião mais rápida do Código — e nasce de uma ruptura conjugal.", "d2": "Familiar/por abandono do lar: 2 anos, 250 m².", "nota": "", "errei": false}, {"n": 129, "id": "m1000-0129", "meta": 21, "disc": "Notarial/Registral", "tema": "Responsabilidade disciplinar", "tipo": "FGV · TJ-ES · 2025", "p": "No afastamento preventivo do delegatário, quanto recebe o interventor se houver condenação, e qual o prazo do afastamento (Lei 8.935/94, arts. 35 e 36)?", "r": "A METADE DEPOSITADA EM CONTA ESPECIAL — durante o afastamento preventivo, o titular afastado percebe metade da renda líquida da serventia e a outra metade fica depositada em conta bancária especial; sobrevindo condenação, esse montante depositado cabe ao INTERVENTOR (absolvido o titular, volta a ele). O afastamento é de até 90 dias, prorrogáveis por mais 30. Pegadinhas: não é prazo de 60 dias improrrogáveis; não se aplicam os prazos prescricionais da improbidade; e não há direito subjetivo do substituto a ser nomeado interventor.", "d1": "Siga o destino da metade da renda depositada em conta especial.", "d2": "Condenado o titular, a metade depositada vai ao interventor; afastamento de 90+30 dias.", "nota": "Você errou esta na Meta 21. Marcou A; gabarito C.", "errei": true}, {"n": 130, "id": "m1000-0130", "meta": 21, "disc": "Notarial/Registral", "tema": "Publicidade registral — certidões", "tipo": "IESES · TJ-PA · 2026", "p": "O que contém a certidão de situação jurídica atualizada do imóvel (LRP, art. 19, §1º)?", "r": "TUDO O QUE ESTÁ VIGENTE — descrição, proprietário, direitos, ônus e restrições, judiciais ou administrativas, incidentes sobre o imóvel E sobre o respectivo titular (art. 19, §1º, da LRP, com a Lei 14.382/2022). Pegadinha: não existem prazos de 5 dias do pagamento ou de \"6 horas\", nem uma \"publicidade indireta\" por LGPD — o registro é público.", "d1": "É a certidão-panorama criada pela reforma de 2022.", "d2": "Situação jurídica = tudo o que vige sobre imóvel e titular.", "nota": "Você errou esta na Meta 21. Marcou A; gabarito C.", "errei": true}, {"n": 131, "id": "m1000-0131", "meta": 21, "disc": "Notarial/Registral", "tema": "Interinidade e prepostos", "tipo": "Consulplan · TJ-AC · 2023", "p": "Escrevente substituto pode praticar ato de interesse próprio na serventia (Lei 8.935/94, arts. 20 a 22)?", "r": "NÃO — o preposto está IMPEDIDO de praticar ato em interesse próprio: ninguém lavra ato em que figure como parte interessada, e o ato assim praticado padece de vício. Pegadinhas vizinhas: o parentesco distante não afasta o impedimento por interesse próprio; a remuneração dos prepostos é ajustada livremente pelo titular (não por tabela do TJ); e a responsabilidade civil alcança atos dos prepostos, com regresso.", "d1": "O problema não é o primo — é quem assina o ato e para quem.", "d2": "Ato em interesse próprio do preposto = impedimento (vício).", "nota": "Você errou esta na Meta 21. Marcou D; gabarito A.", "errei": true}, {"n": 132, "id": "m1000-0132", "meta": 21, "disc": "Notarial/Registral", "tema": "Penalidades — art. 33", "tipo": "FGV · TJ-ES · 2025", "p": "Como o art. 33 da Lei 8.935/94 escalona as penas de repreensão, multa e suspensão?", "r": "REPREENSÃO (falta leve) → MULTA (reincidência ou infração que não configure falta mais grave) → SUSPENSÃO 90+30 (reiterado descumprimento dos deveres ou falta grave) → perda da delegação (faltas do art. 35). Pegadinha: a primeira pena é REPREENSÃO, não \"advertência\" — as bancas trocam o nome ou deslocam as hipóteses entre as penas.", "d1": "Confira o nome exato da pena mais branda e o encaixe de cada hipótese.", "d2": "Repreensão, multa, suspensão, perda — nessa ordem e nessas hipóteses.", "nota": "Você errou esta na Meta 21. Marcou C; gabarito A.", "errei": true}, {"n": 133, "id": "m1000-0133", "meta": 21, "disc": "Notarial/Registral", "tema": "Certidões do RCPN", "tipo": "IESES · TJ-PA · 2026", "p": "A certidão do registro civil pode mencionar se a filiação é legítima ou não (LRP, arts. 19, 20 e 45)?", "r": "NÃO — é VEDADO mencionar na certidão a circunstância de ser legítima ou não a filiação (art. 45 da LRP), proteção contra discriminação. Regras vizinhas corretas: certidão em inteiro teor, resumo ou relatório conforme quesitos (art. 19); inteiro teor por meio reprográfico ou eletrônico (art. 19, §1º); certidão de nascimento com data do registro, data por extenso do nascimento e naturalidade (art. 20).", "d1": "Há uma vedação protetiva histórica sobre o que a certidão pode revelar da filiação.", "d2": "Legitimidade da filiação jamais aparece na certidão.", "nota": "Você errou esta na Meta 21. Marcou A; gabarito C.", "errei": true}, {"n": 134, "id": "m1000-0134", "meta": 21, "disc": "Notarial/Registral", "tema": "RCPN em municípios extensos", "tipo": "Consulplan · TJ-AC · 2023", "p": "Nos municípios de significativa extensão territorial, o que a lei garante quanto ao RCPN (Lei 8.935/94, art. 44, §3º)?", "r": "CADA SEDE DISTRITAL COM AO MENOS UM REGISTRADOR CIVIL — nos municípios de significativa extensão territorial, a juízo do respectivo Estado, cada sede distrital disporá, no mínimo, de um registrador civil das pessoas naturais (art. 44, §3º). Pegadinhas: sucursais são VEDADAS (§4º); a gratuidade alcança nascimento E óbito com a 1ª certidão (Lei 9.534/97); e os atos do serviço independem de autorização (art. 41).", "d1": "Pensa no acesso ao registro civil em municípios gigantes com distritos povoados.", "d2": "Um RCPN por sede distrital, a juízo do Estado.", "nota": "Você errou esta na Meta 21. Marcou D; gabarito A.", "errei": true}, {"n": 135, "id": "m1000-0135", "meta": 21, "disc": "Notarial/Registral", "tema": "Certidão de inteiro teor e ônus", "tipo": "CEBRASPE · TJ-RR · 2025", "p": "Na certidão de inteiro teor da matrícula, é preciso declarar expressamente a inexistência de ônus (LRP, arts. 17 a 19)?", "r": "NÃO — a certidão de inteiro teor reproduz integralmente a matrícula com seus registros e averbações, já evidenciando a existência ou não de ônus; é tecnicamente desnecessária a declaração expressa à parte. Pegadinhas: nem toda certidão tem prazo de 5 dias; com a interconexão é possível pedir certidão de atos de outras serventias; e a publicidade também se dá de forma direta (informações).", "d1": "O que a reprodução integral da matrícula já mostra por si?", "d2": "Inteiro teor dispensa declaração de \"inexistência de ônus\".", "nota": "Você errou esta na Meta 21. Marcou E; gabarito B.", "errei": true}, {"n": 136, "id": "m1000-0136", "meta": 21, "disc": "Notarial/Registral", "tema": "Guarda dos livros", "tipo": "IESES · TJ-TO · 2022", "p": "Sob guarda de quem ficam os livros da serventia e como ocorre o exame pericial (LRP, art. 46)?", "r": "DO TITULAR, COM PERÍCIA NA SEDE — livros, fichas e documentos permanecem sob guarda e responsabilidade do TITULAR; havendo necessidade de serem PERICIADOS, o exame ocorre na sede do serviço, em dia e hora designados antecipadamente, com ciência do titular e autorização do JUÍZO COMPETENTE (art. 46 da LRP). Pegadinha: a autorização é do juízo competente, não do corregedor-geral.", "d1": "Os livros não viajam — e quem autoriza o exame não é o corregedor.", "d2": "Titular guarda; perícia na sede com autorização do juízo competente.", "nota": "", "errei": false}, {"n": 137, "id": "m1000-0137", "meta": 21, "disc": "Notarial/Registral", "tema": "Suspensão — prazo", "tipo": "FGV · Enac · 2025", "p": "Qual a pena para o reiterado descumprimento dos deveres pelo notário, sem hipótese de perda da delegação (Lei 8.935/94, arts. 33 e 35)?", "r": "SUSPENSÃO POR 90 DIAS, PRORROGÁVEL POR MAIS 30 — o reiterado descumprimento dos deveres (fora das hipóteses de perda) atrai a suspensão de 90+30 dias (arts. 33 e 35). Pegadinha: o prazo não é de 60 dias, e a hipótese não se resolve com repreensão ou multa, penas próprias de faltas mais brandas.", "d1": "O prazo da suspensão dos notários nunca é o que parece \"redondo\" de 60.", "d2": "90 dias + 30 de prorrogação.", "nota": "", "errei": false}, {"n": 138, "id": "m1000-0138", "meta": 21, "disc": "Notarial/Registral", "tema": "Modalidades de certidão", "tipo": "VUNESP · TJ-SP · 2024", "p": "Certidão com os elementos do breve relatório MAIS outros indicados pelo usuário: qual a modalidade (LRP, art. 19, §1º)?", "r": "CERTIDÃO EM RELATÓRIO, CONFORME QUESITOS — quando o interessado especifica por quesitos os elementos que quer ver constar, a modalidade é a certidão em relatório (art. 19, §1º, da LRP). Pegadinha: inteiro teor reproduz tudo; resumo traz os elementos essenciais padronizados; e \"inteiro teor parcial\" não existe na LRP.", "d1": "O usuário mandou uma lista do que quer na certidão — isso tem nome na lei.", "d2": "Relatório, conforme quesitos.", "nota": "", "errei": false}, {"n": 139, "id": "m1000-0139", "meta": 21, "disc": "Notarial/Registral", "tema": "Atribuições — art. 41", "tipo": "IESES · TJ-AM · 2023", "p": "Notários e oficiais precisam de autorização para praticar os atos de organização e execução dos serviços (Lei 8.935/94, art. 41)?", "r": "NÃO — incumbe-lhes praticar, INDEPENDENTEMENTE DE AUTORIZAÇÃO, todos os atos previstos em lei necessários à organização e execução dos serviços, podendo adotar sistemas de computação, microfilmagem, disco ótico e outros meios de reprodução (art. 41). Pegadinhas: as gestões e diligências do preparo dos atos incumbem ao próprio delegatário (não ao juízo) e a sucursal em outra localidade é vedada.", "d1": "Quem gerencia a serventia no dia a dia precisa pedir licença a alguém?", "d2": "Independentemente de autorização (art. 41).", "nota": "Você errou esta na Meta 21. Marcou A; gabarito B.", "errei": true}, {"n": 140, "id": "m1000-0140", "meta": 21, "disc": "Notarial/Registral", "tema": "Gradação das penas", "tipo": "Consulplan · TJ-MA · 2023", "p": "Quando o notário comete uma falta leve e, depois, uma falta grave, quais penas cabem a cada uma e o que rege a imposição (Lei 8.935/94, arts. 32, 33 e 35)?", "r": "REPREENSÃO NA LEVE E SUSPENSÃO 90+30 NA GRAVE, CONFORME A GRAVIDADE — à falta leve corresponde a repreensão; à grave, a suspensão por 90 dias prorrogável por mais 30, sempre considerando a gravidade dos fatos na imposição. Pegadinhas: a multa não é etapa obrigatória antes da suspensão; suspensão preventiva (cautelar) não se confunde com a pena final; e a perda da delegação também cabe por decisão administrativa, não só por sentença judicial.", "d1": "A gradação não é escada rígida — a pena acompanha a gravidade do fato.", "d2": "Leve = repreensão; grave = suspensão 90+30.", "nota": "Você errou esta na Meta 21. Marcou B; gabarito C.", "errei": true}, {"n": 141, "id": "m1000-0141", "meta": 21, "disc": "Notarial/Registral", "tema": "Gratuidade ao pobre", "tipo": "FGV · TJ-SC · 2021", "p": "Pessoa reconhecidamente pobre pede 2ª via de certidão de nascimento: paga? A pobreza é anotada na certidão (Lei 9.534/97)?", "r": "GRATUITA E SEM ANOTAÇÃO — aos reconhecidamente pobres asseguram-se gratuitamente o registro e a certidão, sendo PROIBIDO inserir na certidão expressões que indiquem condição de pobreza ou semelhantes (evita estigma). Pegadinha: não se exige decisão judicial nem justificativa de motivo relevante. Jurisprudência: é constitucional lei estadual criar fundo de apoio ao registro civil para compensar os atos gratuitos (STF).", "d1": "Duas proteções: no bolso e na dignidade do documento.", "d2": "Grátis ao pobre + vedada menção à pobreza na certidão.", "nota": "", "errei": false}, {"n": 142, "id": "m1000-0142", "meta": 21, "disc": "Notarial/Registral", "tema": "Certidão de inteiro teor", "tipo": "Consulplan · TJ-AC · 2023", "p": "Por qual meio se extrai a certidão de inteiro teor (LRP, art. 19, §1º)?", "r": "POR MEIO REPROGRÁFICO OU ELETRÔNICO — é o que prevê o art. 19, §1º, da LRP para a certidão de inteiro teor. Pegadinhas vizinhas: a certidão de nascimento traz a data do REGISTRO e a data por extenso do NASCIMENTO (cuidado para não inverter esses elementos) e é vedado, sem exceção, mencionar a legitimidade da filiação (art. 45).", "d1": "Como se copia fielmente uma matrícula ou assento inteiro?", "d2": "Reprográfico ou eletrônico.", "nota": "", "errei": false}, {"n": 143, "id": "m1000-0143", "meta": 21, "disc": "Notarial/Registral", "tema": "Afastamento preventivo — renda", "tipo": "Consulplan · TJ-AC · 2023", "p": "No afastamento preventivo, como se divide a renda da serventia e a quem vai a metade retida se houver perda da delegação (Lei 8.935/94, art. 36)?", "r": "METADE AO TITULAR AFASTADO, METADE DEPOSITADA — e, sobrevindo a PERDA DA DELEGAÇÃO, o montante depositado é destinado ao INTERVENTOR que respondeu pela serventia (art. 36). Pegadinhas: não existe suspensão de 180 dias (é 90+30); a perda da delegação também pode resultar de processo administrativo; e o afastado não conserva toda a renda.", "d1": "O destino da metade depositada depende do resultado do processo.", "d2": "Condenado à perda → a metade retida vai ao interventor.", "nota": "", "errei": false}, {"n": 144, "id": "m1000-0144", "meta": 21, "disc": "Notarial/Registral", "tema": "Publicidade × sigilo", "tipo": "Consulplan · TJ-AC · 2023", "p": "Quem pede certidão do registro precisa declarar o motivo? Quais as exceções sigilosas (LRP, art. 17; Lei 9.807/99; ECA)?", "r": "NÃO PRECISA — qualquer pessoa pode requerer certidão SEM informar motivo ou interesse, independentemente de autorização (art. 17 da LRP). Exceções: a certidão de alteração de nome por coação/ameaça decorrente de colaboração com apuração de crime exige autorização judicial (Lei 9.807/99) e, na adoção, é vedado expor os nomes dos pais biológicos (sigilo da origem). Pegadinha: a regra é a publicidade ampla; o sigilo é pontual e protetivo.", "d1": "Regra escancarada, exceções blindadas — proteção à testemunha e ao adotado.", "d2": "Sem motivo declarado (art. 17); coação e adoção pedem autorização judicial.", "nota": "Você errou esta na Meta 21. Marcou D; gabarito A.", "errei": true}, {"n": 145, "id": "m1000-0145", "meta": 21, "disc": "Notarial/Registral", "tema": "Ordem do serviço", "tipo": "IESES · TJ-PA · 2026", "p": "Registro lavrado fora do horário regulamentar é automaticamente nulo e configura improbidade (LRP, arts. 8º, 9º e 9º-A)?", "r": "NÃO — a LRP disciplina o horário do serviço, mas NÃO comina nulidade automática ao registro lavrado fora de hora nem o caracteriza, por si, como improbidade administrativa: nulidade e improbidade, aqui, são sanções que a lei não prevê. Valem, porém, as regras vizinhas: prazos em dias e horas úteis (art. 9º-A), RCPN funcionando todos os dias, impedimento do oficial parente (ato ao substituto legal) e horário uniforme nos dias úteis.", "d1": "Desconfie de sanções dramáticas (nulidade + improbidade) que a lei não escreveu.", "d2": "Fora de hora ≠ nulidade automática nem improbidade.", "nota": "Você errou esta na Meta 21. Marcou C; gabarito E.", "errei": true}, {"n": 146, "id": "m1000-0146", "meta": 21, "disc": "Notarial/Registral", "tema": "Contagem de prazos", "tipo": "IESES · TJ-AM · 2023", "p": "Como se contam os prazos da prenotação, dos emolumentos e dos atos de RI, RTD e RCPJ (LRP, art. 9º-A)?", "r": "EM DIAS E HORAS ÚTEIS — o art. 9º-A da LRP (Lei 14.382/2022) manda contar em dias e horas úteis os prazos da prenotação, do pagamento de emolumentos e da prática de atos pelos oficiais de RI, RTD e RCPJ, incluída a emissão de certidões, salvo os casos legais e os contados em meses e anos. Pegadinhas: a contagem segue a legislação processual civil (não \"a civil\") e a falta do ITBI NÃO obsta a apresentação e o protocolo do título.", "d1": "Regra nova da reforma de 2022 sobre o calendário do registro.", "d2": "Dias e horas úteis (art. 9º-A).", "nota": "Você errou esta na Meta 21. Marcou D; gabarito B.", "errei": true}, {"n": 147, "id": "m1000-0147", "meta": 21, "disc": "Notarial/Registral", "tema": "Livros do RCPN", "tipo": "Consulplan · TJ-AC · 2023", "p": "Quais são os livros do Registro Civil das Pessoas Naturais (LRP, art. 33)?", "r": "A, B, B AUXILIAR, C, C AUXILIAR E D — nascimento (A), casamento (B), casamento religioso para efeitos civis (B Aux), óbitos (C), natimortos (C Aux) e proclamas (D), conforme o art. 33 da LRP. Pegadinha: NÃO existe livro \"E\" no RCPN — desconfie de invenções como livro E mercantil, de inadimplentes ou de dívida ativa.", "d1": "Recite a sequência dos livros e pare na letra certa.", "d2": "A até D, com B e C auxiliares — sem livro E.", "nota": "", "errei": false}, {"n": 148, "id": "m1000-0148", "meta": 21, "disc": "Notarial/Registral", "tema": "Conservação do acervo", "tipo": "CEBRASPE · TJ-RR · 2025", "p": "Por quanto tempo os documentos do acervo devem permanecer no arquivo da serventia (LRP, art. 22)?", "r": "POR PRAZO INDEFINIDO — a conservação do acervo é permanente, no arquivo da serventia, sob responsabilidade do delegatário (art. 22 da LRP). Pegadinhas: livro não sai da serventia por mera consulta (só com autorização judicial — art. 24) e o exame pericial ocorre na sede do serviço mediante autorização do juízo (art. 46), não a critério do notário.", "d1": "O acervo registral tem data de validade?", "d2": "Conservação permanente, prazo indefinido (art. 22).", "nota": "Você errou esta na Meta 21. Marcou E; gabarito D.", "errei": true}, {"n": 149, "id": "m1000-0149", "meta": 21, "disc": "Notarial/Registral", "tema": "Natureza dos serviços", "tipo": "CEBRASPE · TJ-PE · 2024", "p": "Qual a natureza dos serviços notariais e de registro e como respondem delegatário e Estado (CF, art. 236; Lei 8.935/94, arts. 3º e 22)?", "r": "FUNÇÃO PÚBLICA EXERCIDA EM CARÁTER PRIVADO, SOB FISCALIZAÇÃO — os serviços são exercidos em caráter privado por delegação (art. 236 da CF), mas constituem função pública fiscalizada pelo Judiciário; o tabelionato NÃO tem personalidade jurídica própria. Pegadinha: o delegatário responde SUBJETIVAMENTE (art. 22, com a Lei 13.286/2016 — inclusive o tabelião de protesto); o Estado responde OBJETIVAMENTE, com regresso por dolo ou culpa (STF, Tema 777).", "d1": "Privado no exercício, público na essência — e dois regimes de responsabilidade.", "d2": "Função pública fiscalizada; notário subjetivo, Estado objetivo.", "nota": "", "errei": false}, {"n": 150, "id": "m1000-0150", "meta": 21, "disc": "Notarial/Registral", "tema": "Vacância e interinidade", "tipo": "FGV · Enac · 2025", "p": "Vaga a serventia, quem responde interinamente e quem o designa (Lei 8.935/94, art. 39)?", "r": "O SUBSTITUTO MAIS ANTIGO, DESIGNADO PELA CORREGEDORIA OU POR JUIZ COMPETENTE — declarada a vacância, o serviço fica interinamente com o substituto mais antigo de cada serventia até o provimento por concurso (art. 39 c/c normas do CNJ). Pegadinhas: não há acumulação compulsória de serventias por um só interino, a designação não é exclusiva da Corregedoria e o critério é ANTIGUIDADE, não maior idade — nem existe prazo máximo de um ano.", "d1": "O critério de escolha do interino é objetivo — mas não é a idade.", "d2": "Substituto mais antigo; Corregedoria ou juiz designam.", "nota": "Você errou esta na Meta 21. Marcou E; gabarito D.", "errei": true}, {"n": 151, "id": "m1000-0151", "meta": 21, "disc": "Notarial/Registral", "tema": "Guarda dos livros (LRP)", "tipo": "IESES · TJ-AM · 2023", "p": "Como a LRP disciplina a guarda e a conservação dos livros e papéis do cartório (LRP, arts. 22-26)?", "r": "GUARDA PERMANENTE PELO OFICIAL, que responde pela ordem e conservação; os papéis são arquivados por processos racionais, FACULTADA a microfilmagem, e o acervo permanece INDEFINIDAMENTE no cartório. No desmembramento, os registros continuam no cartório de origem até a instalação do novo, sem repetição, e o arquivo antigo permanece com ele (arts. 22, 25 e 26). Pegadinha: microfilmagem é facultativa, não obrigatória.", "d1": "Pense em quem responde pelo acervo e por quanto tempo ele fica na serventia.", "d2": "Guarda permanente, microfilmagem facultativa, acervo fica para sempre — tudo verdadeiro.", "nota": "", "errei": false}, {"n": 152, "id": "m1000-0152", "meta": 22, "disc": "Notarial/Registral", "tema": "Registro de nascimento — declarantes", "tipo": "FGV · TJ-ES · Cartórios/Ingresso · 2025", "p": "Se os pais estão impedidos (inconscientes), quem declara o nascimento (LRP, art. 52)?", "r": "O MÉDICO OU A PARTEIRA QUE ASSISTIU O PARTO (ou o administrador do hospital), na falta ou impedimento dos pais e do parente mais próximo — há uma ordem legal de declarantes no art. 52 da LRP. Não se exige autorização judicial: existem declarantes subsidiários. Pegadinha: não se salta direto para a via judicial.", "d1": "A LRP monta uma fila de obrigados a declarar o nascimento.", "d2": "Pais → parente mais próximo → administrador do hospital/médico que assistiu o parto.", "nota": "", "errei": false}, {"n": 153, "id": "m1000-0153", "meta": 22, "disc": "Notarial/Registral", "tema": "Gratuidade — estado de pobreza", "tipo": "Consulplan · TJ-AC · Cartórios/Ingresso · 2023", "p": "Como se comprova o estado de pobreza para fins de gratuidade registral (LRP, art. 30, §1º)?", "r": "POR DECLARAÇÃO DO PRÓPRIO INTERESSADO ou, sendo analfabeto, a rogo, com a assinatura de DUAS TESTEMUNHAS (art. 30, §1º, da LRP). A falsidade gera responsabilidade civil E criminal, não só civil. Pegadinha: nascimento e óbito (com a 1ª certidão) são gratuitos para TODOS, sem depender de declaração de pobreza (Lei 9.534/97).", "d1": "A prova da pobreza é simples — não exige documento fiscal nenhum.", "d2": "Declaração do interessado; analfabeto assina a rogo com 2 testemunhas.", "nota": "", "errei": false}, {"n": 154, "id": "m1000-0154", "meta": 22, "disc": "Notarial/Registral", "tema": "Naturalidade e nome do padrasto", "tipo": "Cespe/CEBRASPE · TJ-RR · Cartórios/Remoção · 2025", "p": "O que a LRP prevê sobre a naturalidade da criança e sobre o nome de família do padrasto (arts. 54, §4º, e 57, §8º)?", "r": "NATURALIDADE À OPÇÃO DO DECLARANTE: município do nascimento OU da residência da mãe, se ambos no Brasil (art. 54, §4º); e o enteado pode averbar o nome de família do padrasto/madrasta, havendo motivo justificável e CONCORDÂNCIA expressa destes (art. 57, §8º). Pegadinha: as certidões do RCPN contêm normalmente estado civil e filiação — não há vedação que dependa de autorização judicial.", "d1": "Dois pontos: onde a criança 'nasce' para o registro e o sobrenome afetivo.", "d2": "Naturalidade: nascimento ou residência da mãe, quem escolhe é o declarante.", "nota": "", "errei": false}, {"n": 155, "id": "m1000-0155", "meta": 22, "disc": "Notarial/Registral", "tema": "Gratuidade universal", "tipo": "IESES · TJ-PA · Cartórios/Ingresso · 2026", "p": "Qual o alcance da gratuidade universal dos atos do registro civil (Lei 9.534/97; LRP, art. 30)?", "r": "NASCIMENTO + ÓBITO + A PRIMEIRA CERTIDÃO DE CADA — gratuitos para todos os usuários, não só para os pobres, e sem depender de decisão judicial (Lei 9.534/97). Pegadinha: a gratuidade universal NÃO alcança as certidões posteriores, só a primeira de nascimento e a primeira de óbito.", "d1": "Dois atos da vida civil são de graça para todo mundo — e vem um brinde cada.", "d2": "Registro de nascimento, assento de óbito e a 1ª certidão respectiva.", "nota": "", "errei": false}, {"n": 156, "id": "m1000-0156", "meta": 22, "disc": "Notarial/Registral", "tema": "Alteração de prenome", "tipo": "FGV · Enac · Cartórios · 2025", "p": "Como funciona a alteração imotivada do prenome pelo maior de idade (LRP, art. 56)?", "r": "DIRETO NO CARTÓRIO, SEM DECISÃO JUDICIAL, mas UMA ÚNICA VEZ — fica vedada nova alteração extrajudicial (art. 56 da LRP, redação da Lei 14.382/2022). Não é preciso provar exposição ao ridículo: basta ser maior e capaz. Pegadinha: a segunda mudança só pela via judicial.", "d1": "Depois da maioridade, mudar o prenome ficou muito mais simples — mas com um limite.", "d2": "Extrajudicial e imotivada, porém só uma vez.", "nota": "", "errei": false}, {"n": 157, "id": "m1000-0157", "meta": 22, "disc": "Notarial/Registral", "tema": "RCPN — serviços conexos", "tipo": "Cespe/CEBRASPE · TJ-RO · Cartórios/Remoção · 2025", "p": "O RCPN pode prestar serviços remunerados conexos aos típicos? O que se exige?", "r": "PODE, MAS SÓ COM PRÉVIA HOMOLOGAÇÃO PELO PODER JUDICIÁRIO (corregedoria competente) — condição de licitude da atividade acessória. Vizinhos que caem junto: a DESCONSTITUIÇÃO da alteração imotivada de prenome exige sentença judicial (art. 56), e a omissão do nome do pai NÃO autoriza recusa do registro (registra-se com a maternidade + averiguação oficiosa, Lei 8.560/92).", "d1": "Atividade acessória do cartório não nasce da vontade do oficial sozinho.", "d2": "Serviço remunerado conexo depende de aval prévio do Judiciário.", "nota": "", "errei": false}, {"n": 158, "id": "m1000-0158", "meta": 22, "disc": "Notarial/Registral", "tema": "Habilitação e proclamas", "tipo": "IESES · TJ-AM · Cartórios/Ingresso · 2023", "p": "Na escrituração dos proclamas, quem paga a publicação do edital e o que contém o registro (LRP, arts. 67 e segs.)?", "r": "OS PROCLAMAS SÃO ESCRITURADOS CRONOLOGICAMENTE com o resumo dos EDITAIS expedidos ou recebidos; a despesa de publicação do edital é do INTERESSADO; e o REGISTRO do edital contém época de publicação e documentos apresentados. Proclamas/habilitação vão no Livro D. Pegadinha: a despesa não é do oficial.", "d1": "Quem quer casar arca com o quê no edital?", "d2": "Proclamas, editais, interessado paga, e o registro traz as indicações.", "nota": "", "errei": false}, {"n": 159, "id": "m1000-0159", "meta": 22, "disc": "Notarial/Registral", "tema": "Atos de registro no RCPN", "tipo": "FGV · Enac · Cartórios · 2025", "p": "Além dos nascimentos, quais atos são REGISTRADOS no RCPN (LRP, art. 29)?", "r": "CASAMENTOS, ÓBITOS E TAMBÉM AS EMANCIPAÇÕES — casamento no Livro B, óbito no Livro C e emancipação no Livro E (art. 29, IV, e art. 89 da LRP). Pegadinha: a emancipação é ato de REGISTRO no Livro E, não mera averbação.", "d1": "Um dos quatro atos costuma ser esquecido porque não parece 'registro'.", "d2": "A emancipação entra no rol — Livro E.", "nota": "", "errei": false}, {"n": 160, "id": "m1000-0160", "meta": 22, "disc": "Notarial/Registral", "tema": "Nascimento a bordo", "tipo": "VUNESP · TJ-SP · Cartórios/Remoção · 2024", "p": "Onde se registra o nascimento de filho de brasileiro em alto-mar, a bordo de navio estrangeiro com destino ao Brasil (LRP, art. 65)?", "r": "NO LIVRO E DO 1º OFÍCIO DO LOCAL DO DESEMBARQUE (art. 65 da LRP) — o Livro E é o dos atos diversos, e o desembarque define a circunscrição. Pegadinha: não é Livro A nem competência pela residência dos pais.", "d1": "Navio estrangeiro muda o livro e o critério de competência.", "d2": "Livro E, onde a família desceu do navio.", "nota": "", "errei": false}, {"n": 161, "id": "m1000-0161", "meta": 23, "disc": "Constitucional", "tema": "Município — interesse local", "tipo": "FGV · ENAC · 2025", "p": "Lei municipal de origem parlamentar que cria campanha de conscientização sobre alienação parental é constitucional (CF, art. 30, I)?", "r": "SIM — É CONSTITUCIONAL: campanha de esclarecimento tem interesse local predominante (art. 30, I) e não invade competência da União. Sendo de origem parlamentar, só haveria vício se tratasse de organização/funcionamento da Administração (iniciativa reservada, art. 61, §1º, II) — o que mera conscientização não é. Pegadinha: os dois falsos vícios oferecidos são competência privativa da União e vício de iniciativa — nenhum se aplica.", "d1": "Campanha educativa local sem criar estrutura administrativa — há vício?", "d2": "Interesse local salva a lei; conscientização não é matéria de iniciativa reservada.", "nota": "Você errou esta na Meta 23. Marcou A; gabarito D.", "errei": true}, {"n": 162, "id": "m1000-0162", "meta": 23, "disc": "Constitucional", "tema": "Município — licitação suplementar", "tipo": "FGV · TJ-SE · 2023", "p": "Município pode legislar sobre licitação vedando contratos com parentes de agentes públicos (CF, arts. 22, XXVII, e 30, II)?", "r": "PODE — COMPETÊNCIA SUPLEMENTAR: a União edita as normas gerais (art. 22, XXVII), mas o município suplementa para atender peculiaridades locais (art. 30, II), respeitados os princípios do art. 37. A vedação a parentes prestigia moralidade, impessoalidade e isonomia — é constitucional. Pegadinha: as alternativas que afirmam a inconstitucionalidade da vedação invertem o entendimento.", "d1": "Normas gerais da União não esvaziam a competência dos demais entes.", "d2": "Suplementar + moralidade = a lei antinepotismo contratual municipal vale.", "nota": "Você errou esta na Meta 23. Marcou A; gabarito C.", "errei": true}, {"n": 163, "id": "m1000-0163", "meta": 23, "disc": "Constitucional", "tema": "Legislativo — verba de convocação", "tipo": "FGV · ENAC · 2025", "p": "Estado pode criar verba indenizatória para deputados por sessão legislativa extraordinária (CF, art. 57, §7º)?", "r": "NÃO — INCONSTITUCIONAL: a CF veda parcela indenizatória por convocação extraordinária (art. 57, §7º) e essa vedação é de REPRODUÇÃO OBRIGATÓRIA pelos estados (simetria, art. 27, §2º). Pegadinha: rotular de 'indenização' não dribla a vedação — a autonomia estadual não alcança esse ponto.", "d1": "A regra federal sobre sessão extraordinária amarra os estados.", "d2": "Art. 57, §7º é norma de reprodução obrigatória — sem verba extra.", "nota": "", "errei": false}, {"n": 164, "id": "m1000-0164", "meta": 23, "disc": "Constitucional", "tema": "Município — nº de vereadores", "tipo": "IESES · TJ-AM · 2023", "p": "Quais as âncoras do número de vereadores por faixa populacional (CF, art. 29, IV)?", "r": "PISO DE 9 VEREADORES nos municípios de até 15 mil habitantes e TETO DE 55 para mais de 8 milhões (art. 29, IV). Pegadinha: a banca embaralha as faixas intermediárias — 13 vereadores é para mais de 30 mil até 50 mil, não 50-80 mil.", "d1": "Decoreba de faixas: guarde o começo e o fim da escada.", "d2": "9 até 15 mil habitantes; 55 acima de 8 milhões.", "nota": "Você errou esta na Meta 23. Marcou D; gabarito C.", "errei": true}, {"n": 165, "id": "m1000-0165", "meta": 23, "disc": "Constitucional", "tema": "Intervenção federal — ordem pública", "tipo": "FGV · TJ-ES · 2025", "p": "Intervenção federal para pôr termo a grave comprometimento da ordem pública é de que modalidade (CF, art. 34, III)?", "r": "ESPONTÂNEA — o Presidente decreta DE OFÍCIO, sem requisição do STF, sem representação do PGR e sem aprovação prévia do Congresso; o controle político do Congresso é POSTERIOR (art. 36, §§1º e 2º). Pegadinha: requisição, representação e aprovação prévia são traços das intervenções provocadas.", "d1": "Nessa hipótese o decreto vem primeiro; alguém confere depois.", "d2": "Espontânea: decreto de ofício, controle a posteriori do Congresso.", "nota": "Você errou esta na Meta 23. Marcou E; gabarito A.", "errei": true}, {"n": 166, "id": "m1000-0166", "meta": 23, "disc": "Constitucional", "tema": "Processo legislativo — iniciativa tributária", "tipo": "FGV · TJ-SC · 2021", "p": "Matéria tributária é de iniciativa reservada ao chefe do Executivo (CF, art. 61, §1º)?", "r": "NÃO — INICIATIVA GERAL/CONCORRENTE: o rol de iniciativa reservada do art. 61, §1º é taxativo e não inclui matéria tributária (as exceções falam de Territórios, servidores etc.). Logo, projeto parlamentar que revoga taxa municipal é formalmente válido e o veto por vício de iniciativa é indevido. Pegadinha: se houvesse problema, seria vício MATERIAL (anterioridade), não formal.", "d1": "Confere no rol taxativo: tributo está lá entre as matérias reservadas?", "d2": "Vereador pode propor lei tributária — iniciativa não é privativa do Executivo.", "nota": "Você errou esta na Meta 23. Marcou C; gabarito E.", "errei": true}, {"n": 167, "id": "m1000-0167", "meta": 23, "disc": "Constitucional", "tema": "Intervenção federal — repasse de receita", "tipo": "FGV · ENAC · 2025", "p": "Estado que não repassa aos municípios as receitas tributárias constitucionais sofre que modalidade de intervenção (CF, art. 34, V, 'b')?", "r": "ESPONTÂNEA — não repassar receitas fixadas na CF, nos prazos legais, autoriza o Presidente a decretar de ofício, e o decreto deve especificar AMPLITUDE, PRAZO E CONDIÇÕES de execução e, se couber, nomear interventor (art. 36, §1º). Pegadinha: não depende de representação do PGR nem de requerimento de município, e não há exigência de 'dois exercícios financeiros'.", "d1": "Dinheiro constitucional retido dos municípios dispensa provocação.", "d2": "Espontânea; o decreto detalha amplitude, prazo e condições.", "nota": "Você errou esta na Meta 23. Marcou A; gabarito C.", "errei": true}, {"n": 168, "id": "m1000-0168", "meta": 23, "disc": "Constitucional", "tema": "Intervenção federal — recusa a lei federal", "tipo": "FGV · ENAC · 2025", "p": "Como se deflagra a intervenção por recusa à execução de lei federal (CF, arts. 34, VI, e 36, III)?", "r": "PROVOCADA POR ADI INTERVENTIVA DO PGR, com PROVIMENTO pelo STF (art. 36, III) — só depois o Presidente decreta. Pegadinha: a representação vai ao STF pelo PGR, não ao TJ local; e se o decreto se limitar a suspender o ato impugnado, DISPENSA apreciação do Congresso (art. 36, §3º).", "d1": "Decreto estadual mandando ignorar lei federal aciona uma ação específica.", "d2": "PGR representa, STF provê, Presidente decreta.", "nota": "Você errou esta na Meta 23. Marcou D; gabarito A.", "errei": true}, {"n": 169, "id": "m1000-0169", "meta": 23, "disc": "Constitucional", "tema": "Intervenção federal — decisão judicial", "tipo": "Cebraspe · TJ-PE · 2024", "p": "A intervenção federal por desobediência a ordem ou decisão judicial depende de quê (CF, art. 36, II)?", "r": "DE REQUISIÇÃO DO STF, STJ OU TSE, conforme a matéria da decisão descumprida (art. 36, II) — e a requisição VINCULA o Presidente. Pegadinha: não confundir com recusa a lei federal/princípios sensíveis, que vão por representação do PGR com provimento do STF.", "d1": "Quem foi desobedecido é quem aciona o Presidente.", "d2": "Requisição do próprio tribunal: STF, STJ ou TSE.", "nota": "Você errou esta na Meta 23. Marcou D; gabarito B.", "errei": true}, {"n": 170, "id": "m1000-0170", "meta": 23, "disc": "Constitucional", "tema": "Legislativo — Senado e quórum", "tipo": "IESES · TJ-TO · 2022", "p": "Qual o quórum de deliberação das Casas do Congresso (CF, art. 47) e a composição do Senado (art. 46)?", "r": "MAIORIA DE VOTOS, PRESENTE A MAIORIA ABSOLUTA DOS MEMBROS (art. 47) — o erro clássico é trocar a presença por 'maioria simples'. O Senado: 3 senadores por Estado/DF, mandato de 8 anos, 2 suplentes cada, renovação alternada por 1/3 e 2/3 a cada 4 anos (art. 46).", "d1": "O quórum do art. 47 tem duas metades: a de decidir e a de estar presente.", "d2": "Decide-se por maioria simples, mas com maioria ABSOLUTA presente.", "nota": "", "errei": false}, {"n": 171, "id": "m1000-0171", "meta": 23, "disc": "Constitucional", "tema": "Intervenção federal — mínimo do ensino", "tipo": "FGV · TJ-SE · 2023", "p": "Estado que não aplica o mínimo da receita de impostos no ensino: como cabe a intervenção (CF, art. 34, VII, 'e')?", "r": "PRINCÍPIO SENSÍVEL → INTERVENÇÃO PROVOCADA: representação interventiva proposta pelo PGR e julgada (provida) pelo STF (art. 36, III); só depois o Presidente decreta. Pegadinha: não é 'ex officio' (isso é espontânea) e o tribunal não é o STJ.", "d1": "Educação subfinanciada toca num dos princípios do art. 34, VII.", "d2": "Princípio sensível = PGR + STF, nunca de ofício.", "nota": "Você errou esta na Meta 23. Marcou D; gabarito C.", "errei": true}, {"n": 172, "id": "m1000-0172", "meta": 23, "disc": "Constitucional", "tema": "TC — registro de aposentadoria", "tipo": "FGV · TJ-ES · 2025", "p": "Qual o prazo do Tribunal de Contas para apreciar o registro da aposentadoria e de quando conta (STF, Tema 445)?", "r": "CINCO ANOS CONTADOS DA ENTRADA DO PROCESSO NO TRIBUNAL DE CONTAS (Tema 445, RE 636.553) — ultrapassado o prazo, o ato se estabiliza e torna-se IMUTÁVEL, por segurança jurídica. Pegadinha: o termo inicial é o INGRESSO na Corte, não a concessão da aposentadoria; o atraso administrativo antes de chegar ao TC não conta.", "d1": "O relógio da estabilização não começa na concessão do benefício.", "d2": "5 anos do ingresso do expediente no TC; depois, imutável.", "nota": "Você errou esta na Meta 23. Marcou E; gabarito B.", "errei": true}, {"n": 173, "id": "m1000-0173", "meta": 23, "disc": "Constitucional", "tema": "Intervenção — direitos da pessoa humana", "tipo": "Consulplan · TJ-MA · 2023", "p": "Na intervenção por afronta aos direitos da pessoa humana, a decisão do STF basta para deflagrar a medida (CF, arts. 34, VII, 'b', e 36, III)?", "r": "NÃO — É PRECISO O DECRETO POSTERIOR DO EXECUTIVO: a hipótese é princípio sensível, provocada por ADI interventiva do PGR com provimento do STF, mas a decisão judicial não substitui o ato do Presidente. Pegadinha: 'direitos da pessoa humana' está expressamente no rol (art. 34, VII, 'b') — não vale invocar taxatividade para negar; e, provido o pedido, o decreto é vinculado (sem juízo de conveniência).", "d1": "A ADI interventiva termina no STF, mas a intervenção não nasce ali.", "d2": "PGR + provimento do STF + decreto do Presidente — os três passos.", "nota": "Você errou esta na Meta 23. Marcou C; gabarito D.", "errei": true}, {"n": 174, "id": "m1000-0174", "meta": 23, "disc": "Constitucional", "tema": "Tribunais de Contas — natureza", "tipo": "VUNESP · TJ-SP · 2024", "p": "Qual a natureza dos Tribunais de Contas e o que os diferencia na composição (CF, arts. 71, 73 e 130)?", "r": "ÓRGÃOS AUXILIARES DO LEGISLATIVO no controle externo contábil, financeiro e orçamentário (art. 71), e o TCU dispõe de MINISTÉRIO PÚBLICO DE CONTAS próprio (art. 130). Pegadinha: o TCU tem 9 MINISTROS (não conselheiros — conselheiros são os 7 dos TCEs), escolhidos 1/3 pelo Presidente e 2/3 pelo Congresso (art. 73, §2º); e o TCU não avalia contas dos Estados.", "d1": "Cuidado com a nomenclatura dos membros e a fração de escolha.", "d2": "TCU: 9 Ministros + MP de Contas; TCE: 7 conselheiros.", "nota": "Você errou esta na Meta 23. Marcou A; gabarito D.", "errei": true}, {"n": 175, "id": "m1000-0175", "meta": 23, "disc": "Constitucional", "tema": "Legislativo — interna corporis", "tipo": "Cebraspe · TJ-RR · 2025", "p": "Cabe controle judicial da interpretação de normas meramente regimentais das casas legislativas (STF)?", "r": "SÓ QUANDO HÁ DESRESPEITO A NORMA CONSTITUCIONAL — em regra, é matéria interna corporis, imune ao Judiciário. Pegadinha: a alternativa que inclui 'normas legais' alarga demais — o controle se justifica pela ofensa à CONSTITUIÇÃO, não a norma meramente legal ou regimental.", "d1": "Regimento é assunto da Casa — salvo uma fronteira.", "d2": "Judiciário só entra se a Constituição for violada.", "nota": "", "errei": false}, {"n": 176, "id": "m1000-0176", "meta": 23, "disc": "Constitucional", "tema": "Tribunais de Contas — iniciativa", "tipo": "Consulplan · TJ-MA · 2023", "p": "Lei estadual de iniciativa parlamentar pode tratar da organização do Tribunal de Contas estadual (CF, arts. 96, II, e 75)?", "r": "NÃO — INCONSTITUCIONAL POR VÍCIO DE INICIATIVA: a iniciativa é privativa do próprio Tribunal de Contas (simetria com o art. 96, II). Pegadinhas vizinhas: o TC não JULGA as contas do chefe do Executivo (emite parecer prévio — quem julga é o Legislativo), não declara inelegibilidade (Justiça Eleitoral) e, na concessão INICIAL de aposentadoria, dispensa-se o contraditório (Súmula Vinculante 3).", "d1": "Quem organiza o TC é quem propõe a lei sobre ele.", "d2": "Iniciativa do próprio Tribunal — parlamentar não pode.", "nota": "", "errei": false}, {"n": 177, "id": "m1000-0177", "meta": 23, "disc": "Constitucional", "tema": "Legislativo — competência exclusiva", "tipo": "IESES · TJ-PA · 2026", "p": "A quem compete aprovar as iniciativas do Poder Executivo referentes a atividades nucleares?", "r": "COMPETÊNCIA EXCLUSIVA DO CONGRESSO NACIONAL (art. 49, XIV). Pegadinha: a banca mistura com competências privativas de UMA Casa — aprovar Ministro do STF e exonerar o PGR são do SENADO (art. 52), autorizar processo contra o Presidente por 2/3 é da CÂMARA (art. 51); se a atribuição é de uma Casa só, não é 'do Congresso'.", "d1": "Separe o que é bicameral (art. 49) do que é de cada Casa (arts. 51 e 52).", "d2": "Atividades nucleares = art. 49 (Congresso).", "nota": "Você errou esta na Meta 23. Marcou C; gabarito E.", "errei": true}, {"n": 178, "id": "m1000-0178", "meta": 23, "disc": "Constitucional", "tema": "Separação de poderes — contas do Legislativo", "tipo": "Consulplan · TJ-AC · 2023", "p": "Assembleia Legislativa pode julgar as próprias contas (CF, arts. 71 e 75)?", "r": "NÃO — É INCONSTITUCIONAL norma que dê ao Legislativo o julgamento das PRÓPRIAS contas: usurpa a competência do Tribunal de Contas no controle externo e viola a separação de poderes. Pegadinha vizinha: também é inconstitucional norma que fixe prazo para o Executivo regulamentar leis ou apresentar projetos (invade a separação de poderes).", "d1": "Ninguém é juiz da própria prestação de contas.", "d2": "Contas da Assembleia passam pelo Tribunal de Contas.", "nota": "Você errou esta na Meta 23. Marcou D; gabarito A.", "errei": true}, {"n": 179, "id": "m1000-0179", "meta": 23, "disc": "Constitucional", "tema": "Legislativo — poderes da CPI", "tipo": "Cebraspe · TJ-RR · 2025", "p": "O que a CPI pode determinar por autoridade própria e o que fica sob reserva de jurisdição (CF, art. 58, §3º)?", "r": "PODE QUEBRAR SIGILO BANCÁRIO, FISCAL E DE DADOS TELEFÔNICOS, por decisão fundamentada; NÃO pode decretar prisão (salvo flagrante), busca domiciliar nem interceptação telefônica — reserva de jurisdição. Pegadinha: 'dados telefônicos' (registros — pode) é diferente de 'interceptação telefônica' (conteúdo da conversa — não pode).", "d1": "A CPI investiga como juiz, mas três atos continuam exclusivos do juiz.", "d2": "Sigilo bancário sim; interceptação, busca domiciliar e prisão não.", "nota": "Você errou esta na Meta 23. Marcou E; gabarito B.", "errei": true}, {"n": 180, "id": "m1000-0180", "meta": 23, "disc": "Constitucional", "tema": "TCU — fiscalização", "tipo": "Cebraspe · TJ-SC · 2023", "p": "Qual a eficácia das decisões do TCU que imputam débito ou multa (CF, art. 71, §3º)?", "r": "EFICÁCIA DE TÍTULO EXECUTIVO (art. 71, §3º, literal). Pegadinhas ao redor: as nomeações para cargo em comissão ficam FORA da apreciação de admissão (art. 71, III, parte final); o TCU APRECIA (parecer prévio) — não julga — as contas do Presidente; e a SV 3 dispensa o contraditório na concessão INICIAL de aposentadoria.", "d1": "Condenação do TCU vira o quê na execução?", "d2": "Débito ou multa do TCU = título executivo.", "nota": "Você errou esta na Meta 23. Marcou A; gabarito B.", "errei": true}, {"n": 181, "id": "m1000-0181", "meta": 23, "disc": "Constitucional", "tema": "Tribunais de Contas — natureza", "tipo": "VUNESP · TJ-SP · 2022", "p": "Os processos de contas nos Tribunais de Contas têm natureza jurisdicional?", "r": "NÃO — OBSERVAM CONTRADITÓRIO E AMPLA DEFESA, MAS SEM NATUREZA JURISDICIONAL: o TC não exerce jurisdição e suas decisões não fazem coisa julgada material (revisáveis pelo Judiciário). Pegadinha vizinha: é VEDADA a criação de novos Tribunais de Contas dos Municípios (art. 31, §4º).", "d1": "Parece tri
